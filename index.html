---
layout: default
---
<h1>Community Blocks</h1>
<div class="blocks-grid">
  {% for block in site.blocks %}
    <div class="block-card">
      <img src="{{ block.image }}" alt="{{ block.title }}">
      <h3>{{ block.title }}</h3>
      <p>{{ block.description }}</p>
      <a href="{{ block.url }}">Info</a>
    </div>
  {% endfor %}
</div>
