<div id="app">
  <!-- ====== Verification gate (shown when access needed) ====== -->
  <div id="gate" style="display:none; text-align:center;">
    <h2>Цей контент доступний тільки учасникам спільноти</h2>
    <p>Будь ласка, підтвердь участь через Telegram або Discord.</p>
    <div style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin:1.5rem 0;">
      <a id="tg-btn" class="btn-saburo" data-visual="pill" style="--btn-w:auto;--btn-h:48px;--radius:10px;">
        <span class="btn-label">✅ Telegram</span>
      </a>
      <a id="dc-btn" class="btn-saburo" data-visual="pill" style="--btn-w:auto;--btn-h:48px;--radius:10px;">
        <span class="btn-label">✅ Discord</span>
      </a>
    </div>
    <p style="margin-top:2rem;">Ще не з нами?<br>
      <a href="https://t.me/saburo_ua">Telegram</a> |
      <a href="https://discord.gg/4BK4MBUMWh">Discord</a>
    </p>
  </div>

  <!-- ====== Loading for secret page ====== -->
  <div id="loading" style="text-align:center; padding:2rem;">
    <p>Завантаження…</p>
  </div>
</div>

<script>
(function() {
  const path = window.location.pathname;
  const accessMatch = path.match(/^\/(.+)-access\/?$/);

  // ========== 1. ACCESS GATE ==========
  if (accessMatch) {
    const slug = accessMatch[1];
    const secretUrl = '/' + slug;

    document.getElementById('loading').style.display = 'none';
    document.getElementById('gate').style.display = 'block';

    fetch('https://ua.iamsaburo.workers.dev/api/check-token', { credentials:'include' })
      .then(r => r.json())
      .then(data => {
        if (data.valid) {
          window.location.replace(secretUrl);
        }
      });

    fetch(`https://ua.iamsaburo.workers.dev/api/telegram-code?slug=${encodeURIComponent(slug)}`, { credentials:'include' })
      .then(r => r.json())
      .then(data => {
        document.getElementById('tg-btn').href =
          `https://ua.iamsaburo.workers.dev/auth/telegram?code=${data.code}&redirect=${encodeURIComponent(secretUrl)}`;
      });

    document.getElementById('dc-btn').href =
      `https://ua.iamsaburo.workers.dev/auth/discord?redirect=${encodeURIComponent(secretUrl)}`;

    return;
  }

  // ========== 2. SECRET PAGE (any other URL) ==========
  const slug = path.replace(/^\/|\/$/g, '');
  if (!slug) {
    document.getElementById('loading').innerHTML = '<p>Сторінку не знайдено.</p>';
    return;
  }

  // Load Markdown parser (marked) dynamically
  function loadParser() {
    return new Promise(resolve => {
      const script = document.createElement('script');
      script.src = 'https://cdn.jsdelivr.net/npm/marked/marked.min.js';
      script.onload = resolve;
      document.head.appendChild(script);
    });
  }

  // DOM cleanup: remove stray <br> inside block-level elements and empty <p>
  function cleanContent(container) {
    const blockElements = 'div, nav, table, ul, ol, pre, blockquote, h1, h2, h3, h4, h5, h6, section, article, header, footer, aside, figure, figcaption, details, summary, main, canvas, video, audio, form, fieldset, iframe, object, embed, math, svg, script, noscript, style, head, body, html, meta, link, title, base, hr, br, img, input, button, select, textarea, option, label, legend, datalist, output, progress, meter, template, slot, dialog, menu, menuitem, source, track, wbr, area, map, param, col, colgroup, caption, thead, tbody, tfoot, tr, td, th';

    // Remove <br> that are direct children of any block-level container
    container.querySelectorAll(blockElements).forEach(el => {
      el.querySelectorAll(':scope > br').forEach(br => br.remove());
    });

    // Remove truly empty paragraphs (only whitespace inside)
    container.querySelectorAll('p').forEach(p => {
      if (!p.textContent.trim()) {
        p.remove();
      }
    });
  }

  loadParser()
    .then(() => {
      return fetch('https://ua.iamsaburo.workers.dev/api/check-token', { credentials:'include' })
        .then(r => r.json())
        .then(data => {
          if (!data.valid) {
            window.location.replace(`/${slug}-access`);
            return;
          }
          return fetch(`https://ua.iamsaburo.workers.dev/api/content/${slug}`, { credentials:'include' });
        });
    })
    .then(res => {
      if (!res) return;
      if (!res.ok) {
        window.location.replace(`/${slug}-access`);
        return;
      }
      return res.text();
    })
    .then(rawMarkdown => {
      if (!rawMarkdown) return;
      document.getElementById('loading').style.display = 'none';
      const contentContainer = document.querySelector('.content-container');

      // Convert Markdown to HTML using marked
      const html = window.marked.parse(rawMarkdown);
      contentContainer.innerHTML = html;

      // Clean up artifacts that differ from Jekyll's Kramdown
      cleanContent(contentContainer);

      // Activate all interactive features (tabs, copy, etc.)
      if (typeof window.enhanceContent === 'function') {
        window.enhanceContent(contentContainer);
      }
    })
    .catch(() => {
      document.getElementById('loading').innerHTML = '<p>Помилка завантаження. Спробуйте пізніше.</p>';
    });
})();
</script>
