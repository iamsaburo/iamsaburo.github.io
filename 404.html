<div id="app">
  <!-- ====== Verification gate ====== -->
  <div id="gate" style="display:none; max-width:420px; margin:2rem auto; background:var(--sur); border-radius:var(--r); padding:2rem; text-align:center; box-shadow:0 0 0 1px rgba(255,255,255,0.07);">
    <img src="/svg/logo_symbol.svg" width="60" height="60" alt="SABURO" style="margin-bottom:1.5rem;">
    <h2 style="margin-bottom:0.5rem; font-size:1.25rem;">Цей контент доступний тільки учасникам спільноти</h2>
    <p style="color:var(--muted); margin-bottom:2rem;">Будь ласка, підтвердь участь через Telegram або Discord.</p>

    <a id="tg-btn" class="btn-saburo" data-visual="pill" style="--btn-w:100%;--btn-h:48px;--radius:10px; background:#2AABEE; color:#fff !important; margin-bottom:0.75rem; display:flex; align-items:center; justify-content:center; gap:8px;">
      <img src="/svg/sm_telegram.svg" width="20" height="20" alt="" style="flex-shrink:0;">
      <span class="btn-label">Продовжити через Telegram</span>
    </a>

    <p style="color:var(--muted); margin:0.75rem 0;">- або -</p>

    <a id="dc-btn" class="btn-saburo" data-visual="pill" style="--btn-w:100%;--btn-h:48px;--radius:10px; background:#5865F2; color:#fff !important; margin-bottom:1.5rem; display:flex; align-items:center; justify-content:center; gap:8px;">
      <img src="/svg/sm_discord.svg" width="20" height="20" alt="" style="flex-shrink:0;">
      <span class="btn-label">Продовжити через Discord</span>
    </a>

    <p style="color:var(--muted); font-size:0.85rem;">Ще не з нами?<br>
      <a href="https://t.me/saburo_ua" style="color:var(--text);">Telegram</a> |
      <a href="https://discord.gg/4BK4MBUMWh" style="color:var(--text);">Discord</a>
    </p>
    <div id="gate-error" style="color:#ff6b6b; margin-top:1rem; display:none;"></div>
  </div>

  <!-- ====== Loading ====== -->
  <div id="loading" style="text-align:center; padding:2rem;">
    <p>Завантаження…</p>
    <div id="loading-error" style="color:#ff6b6b; display:none;"></div>
  </div>
</div>

<script>
(function() {
  // ---------- Token handling ----------
  const urlParams = new URLSearchParams(window.location.search);
  let authToken = urlParams.get('token');
  console.log('Initial token check:', authToken ? 'found in URL' : 'not in URL');
  if (authToken) {
    localStorage.setItem('auth_token', authToken);
    console.log('Token saved to localStorage');
    const newUrl = window.location.pathname + window.location.hash;
    window.history.replaceState({}, document.title, newUrl);
  } else {
    authToken = localStorage.getItem('auth_token');
    console.log('Token from localStorage:', authToken ? 'found' : 'none');
  }

  function authFetch(url, options = {}) {
    if (authToken) {
      options.headers = options.headers || {};
      options.headers['Authorization'] = `Bearer ${authToken}`;
      console.log(`Fetching ${url} with auth header`);
    } else {
      console.log(`Fetching ${url} WITHOUT auth header`);
    }
    return fetch(url, options);
  }

  // ---------- Markdown parser loader ----------
  let parserReady = null;  // Promise that resolves when marked is loaded
  function loadParser() {
    if (!parserReady) {
      parserReady = new Promise(resolve => {
        if (window.marked) return resolve();
        console.log('Loading marked parser...');
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/marked/marked.min.js';
        script.onload = () => { console.log('Marked loaded'); resolve(); };
        script.onerror = () => {
          console.error('Failed to load marked');
          document.getElementById('loading-error').style.display = 'block';
          document.getElementById('loading-error').textContent = 'Помилка завантаження. Спробуйте пізніше.';
        };
        document.head.appendChild(script);
      });
    }
    return parserReady;
  }

  // ---------- DOM cleanup ----------
  function cleanContent(container) {
    const blockElements = 'div, nav, table, ul, ol, pre, blockquote, h1, h2, h3, h4, h5, h6, section, article, header, footer, aside, figure, figcaption, details, summary, main, canvas, video, audio, form, fieldset, iframe, object, embed, math, svg, script, noscript, style, head, body, html, meta, link, title, base, hr, br, img, input, button, select, textarea, option, label, legend, datalist, output, progress, meter, template, slot, dialog, menu, menuitem, source, track, wbr, area, map, param, col, colgroup, caption, thead, tbody, tfoot, tr, td, th';
    container.querySelectorAll(blockElements).forEach(el => {
      el.querySelectorAll(':scope > br').forEach(br => br.remove());
    });
    container.querySelectorAll('p').forEach(p => {
      if (!p.textContent.trim() && !p.querySelector('img, iframe, video, svg, canvas, pre, table, div, blockquote, ul, ol, hr')) {
        p.remove();
      }
    });
  }

  const path = window.location.pathname;
  const accessMatch = path.match(/^\/(.+)-access\/?$/);
  console.log('Path:', path, 'Access match:', accessMatch);

  // ========== ACCESS GATE ==========
  if (accessMatch) {
    const slug = accessMatch[1];
    const secretUrl = '/' + slug;

    document.getElementById('loading').style.display = 'none';
    document.getElementById('gate').style.display = 'block';

    // Check if already authenticated → skip gate
    console.log('Checking token validity...');
    authFetch('https://ua.iamsaburo.workers.dev/api/check-token', { credentials:'include' })
      .then(r => r.json())
      .then(data => {
        console.log('Check-token response:', data);
        if (data.valid) {
          console.log('Token valid, redirecting to secret page');
          window.location.replace(secretUrl);
        } else {
          console.log('Token invalid or missing');
        }
      })
      .catch(e => {
        console.error('Check-token fetch error:', e);
        document.getElementById('gate-error').style.display = 'block';
        document.getElementById('gate-error').textContent = 'Помилка перевірки. Спробуйте пізніше.';
      });

    // Telegram: direct link to bot
    const tgHref = `https://t.me/saburo_community_bot?start=${slug}`;
    document.getElementById('tg-btn').href = tgHref;
    console.log('Telegram button href:', tgHref);

    // Discord: OAuth via Worker
    const dcHref = `https://ua.iamsaburo.workers.dev/auth/discord?redirect=${encodeURIComponent(secretUrl)}`;
    document.getElementById('dc-btn').href = dcHref;
    console.log('Discord button href:', dcHref);

    return;
  }

  // ========== SECRET PAGE ==========
  const slug = path.replace(/^\/|\/$/g, '');
  console.log('Secret page slug:', slug);
  if (!slug) {
    document.getElementById('loading').innerHTML = '<p>Сторінку не знайдено.</p>';
    return;
  }

  // Start loading parser early
  const parserPromise = loadParser();

  console.log('Verifying token for secret page...');
  authFetch('https://ua.iamsaburo.workers.dev/api/check-token', { credentials:'include' })
    .then(r => r.json())
    .then(data => {
      console.log('Secret check-token:', data);
      if (!data.valid) {
        console.log('Token invalid, redirecting to access');
        window.location.replace(`/${slug}-access`);
        return Promise.reject('redirect');
      }
      console.log('Token valid, fetching content...');
      return authFetch(`https://ua.iamsaburo.workers.dev/api/content/${slug}`, { credentials:'include' });
    })
    .then(res => {
      if (!res) return;
      if (!res.ok) {
        console.log('Content fetch error:', res.status);
        window.location.replace(`/${slug}-access`);
        return Promise.reject('redirect');
      }
      return res.text();
    })
    .then(rawMarkdown => {
      if (!rawMarkdown) return;
      console.log('Content fetched, length:', rawMarkdown.length);
      // Wait for parser to be ready, then render
      return parserPromise.then(() => {
        document.getElementById('loading').style.display = 'none';
        const contentContainer = document.querySelector('.content-container');

        const html = window.marked.parse(rawMarkdown);
        contentContainer.innerHTML = html;
        cleanContent(contentContainer);

        if (typeof window.enhanceContent === 'function') {
          console.log('Running enhanceContent');
          window.enhanceContent(contentContainer);
        }
      });
    })
    .catch(e => {
      if (e === 'redirect') return;
      console.error('Error loading secret page:', e);
      document.getElementById('loading-error').style.display = 'block';
      document.getElementById('loading-error').textContent = 'Помилка завантаження. Спробуйте пізніше.';
    });
})();
</script>
