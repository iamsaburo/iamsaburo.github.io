<style>
  /* Gate – always centred */
  @media(max-width:768px){
    #gate { margin: 1rem auto !important; }
  }
  @media(max-width:480px){
    #gate { margin: 0.75rem auto !important; }
  }
</style>

<div id="app">
  <!-- Verification gate -->
  <div id="gate" style="display:none; max-width:420px; margin:2rem auto 1rem; background:var(--sur); border-radius:var(--r); padding:2rem; text-align:center; box-shadow:0 0 0 1px rgba(255,255,255,0.07);">
    <img src="/svg/saburo-community.svg" width="85" height="auto" alt="SABURO" style="margin-bottom:1.5rem; display:block; margin-left:auto; margin-right:auto;">
    <h2 style="margin-bottom:0.5rem; font-size:1.25rem;">Цей контент доступний тільки для<br>учасників спільноти</h2>
    <p style="color:var(--muted); margin-bottom:2rem;">Будь ласка, авторизуйся<br>через Telegram або Discord.</p>
    <a id="tg-btn" class="btn-saburo" data-visual="pill" style="--btn-w:280px;--btn-h:48px;--radius:4px; background:#2AABEE; color:#fff !important; margin:0 auto 0.75rem; display:flex; align-items:center; justify-content:center; gap:8px;">
      <img src="/svg/sm_telegram.svg" width="18" height="18" alt="" style="flex-shrink:0;">
      <span class="btn-label">Продовжити через Telegram</span>
    </a>
    <p style="color:var(--muted); margin:0.75rem 0;">- або -</p>
    <a id="dc-btn" class="btn-saburo" data-visual="pill" style="--btn-w:280px;--btn-h:48px;--radius:4px; background:#5865F2; color:#fff !important; margin:0 auto 1.5rem; display:flex; align-items:center; justify-content:center; gap:8px;">
      <img src="/svg/sm_discord.svg" width="19" height="19" alt="" style="flex-shrink:0;">
      <span class="btn-label">Продовжити через Discord</span>
    </a>
    <p style="color:var(--muted); font-size:0.85rem;">Ще не з нами?<br>
      <a href="https://t.me/saburo_ua" style="color:var(--text); text-decoration:underline;">Telegram</a> |
      <a href="https://discord.gg/4BK4MBUMWh" style="color:var(--text); text-decoration:underline;">Discord</a>
    </p>
  </div>

  <div id="loading" style="text-align:center; padding:2rem;">
    <p>Завантаження…</p>
    <div id="loading-error" style="color:#ff6b6b; display:none;"></div>
  </div>
</div>

<script>
(function() {
  const urlParams = new URLSearchParams(window.location.search);
  let authToken = urlParams.get('token');
  if (authToken) {
    localStorage.setItem('auth_token', authToken);
    window.history.replaceState({}, document.title, window.location.pathname + window.location.hash);
  } else {
    authToken = localStorage.getItem('auth_token');
  }

  function authFetch(url, options = {}) {
    if (authToken) {
      options.headers = options.headers || {};
      options.headers['Authorization'] = `Bearer ${authToken}`;
    }
    return fetch(url, options);
  }

  let parserReady = null;
  function loadParser() {
    if (!parserReady) {
      parserReady = new Promise(resolve => {
        if (window.marked) return resolve();
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/marked/marked.min.js';
        script.onload = resolve;
        document.head.appendChild(script);
      });
    }
    return parserReady;
  }

  function cleanContent(container) {
    const blockElements = 'div, nav, table, ul, ol, pre, blockquote, h1, h2, h3, h4, h5, h6, section, article, header, footer, aside, figure, figcaption, details, summary, main, canvas, video, audio, form, fieldset, iframe, object, embed, math, svg, script, noscript, style, head, body, html, meta, link, title, base, hr, br, img, input, button, select, textarea, option, label, legend, datalist, output, progress, meter, template, slot, dialog, menu, menuitem, source, track, wbr, area, map, param, col, colgroup, caption, thead, tbody, tfoot, tr, td, th';
    container.querySelectorAll(blockElements).forEach(el => {
      el.querySelectorAll(':scope > br').forEach(br => br.remove());
    });
    container.querySelectorAll('p').forEach(p => {
      if (!p.textContent.trim() && !p.querySelector('img, iframe, video, svg, canvas, pre, table, div, blockquote, ul, ol, hr')) {
        p.remove();
      }
    });
  }

  function addBackButton(slug) {
    var navLeft = document.querySelector('.nav-left');
    if (!navLeft) return;
    var btn = document.createElement('a');
    btn.className = 'btn-saburo';
    btn.setAttribute('data-visual', 'pill');
    btn.setAttribute('data-icon-visual', 'arrow_back');
    btn.setAttribute('data-icon-hover', 'arrow_back');
    btn.setAttribute('data-icon-position', 'before');
    btn.style.cssText = '--btn-w:auto;--btn-h:32px;--radius:28px;';
    btn.href = '/' + slug + '-info';
    btn.innerHTML = `
      <span class="material-icons-round btn-icon btn-icon-visual">arrow_back</span>
      <span class="material-icons-round btn-icon btn-icon-hover">arrow_back</span>
      <span class="btn-label">Назад</span>
    `;
    var brand = document.querySelector('.nav-brand');
    if (brand) {
      brand.after(btn);
    } else {
      navLeft.prepend(btn);
    }
    var tagline = document.querySelector('.nav-tagline');
    if (tagline) tagline.style.display = 'none';
    var wordmark = document.querySelector('.nav-wordmark');
    if (wordmark) wordmark.classList.add('nav-wordmark--info');
  }

  function setTabTitle(title) {
    document.title = title ? `SABURO™ | ${title}` : 'SABURO™';
  }

  const path = window.location.pathname;
  const accessMatch = path.match(/^\/(.+)-access\/?$/);
  const contentContainer = document.querySelector('.content-container');
  const slug = accessMatch ? accessMatch[1] : path.replace(/^\/|\/$/g, '');

  if (slug) {
    if (accessMatch) {
      setTabTitle('Доступ');
      addBackButton(slug);
    } else {
      fetch(`https://ua.iamsaburo.workers.dev/api/info/${slug}`)
        .then(r => r.json())
        .then(data => {
          setTabTitle(data.title || slug);
          addBackButton(slug);
        })
        .catch(() => {
          setTabTitle(slug);
          addBackButton(slug);
        });
    }
  }

  if (accessMatch) {
    const secretUrl = '/' + slug;
    document.getElementById('loading').style.display = 'none';
    var gateEl = document.getElementById('gate');
    var pageWrap = document.querySelector('.page-wrap');
    if (pageWrap && gateEl) {
      pageWrap.insertBefore(gateEl, pageWrap.firstChild);
    }
    gateEl.style.display = 'block';
    if (contentContainer) contentContainer.style.display = 'none';

    authFetch('https://ua.iamsaburo.workers.dev/api/check-token', { credentials:'include' })
      .then(r => r.json())
      .then(data => { if (data.valid) window.location.replace(secretUrl); });

    document.getElementById('tg-btn').href = `https://t.me/saburo_community_bot?start=${slug}`;
    document.getElementById('dc-btn').href = `https://ua.iamsaburo.workers.dev/auth/discord?redirect=${encodeURIComponent(secretUrl)}`;
    return;
  }

  if (!slug) {
    document.getElementById('loading').innerHTML = '<p>Сторінку не знайдено.</p>';
    return;
  }

  const parserPromise = loadParser();

  authFetch('https://ua.iamsaburo.workers.dev/api/check-token', { credentials:'include' })
    .then(r => r.json())
    .then(data => {
      if (!data.valid) {
        window.location.replace(`/${slug}-access`);
        return Promise.reject('redirect');
      }
      return authFetch(`https://ua.iamsaburo.workers.dev/api/content/${slug}`, { credentials:'include' });
    })
    .then(res => {
      if (!res.ok) {
        window.location.replace(`/${slug}-access`);
        return Promise.reject('redirect');
      }
      return res.text();
    })
    .then(rawMarkdown => {
      if (!rawMarkdown) return;
      return parserPromise.then(() => {
        document.getElementById('loading').style.display = 'none';
        if (contentContainer) contentContainer.style.display = '';
        const html = window.marked.parse(rawMarkdown);
        contentContainer.innerHTML = html;
        cleanContent(contentContainer);
        if (typeof window.enhanceContent === 'function') {
          window.enhanceContent(contentContainer);
        }
      });
    })
    .catch(e => {
      if (e === 'redirect') return;
      document.getElementById('loading-error').style.display = 'block';
      document.getElementById('loading-error').textContent = 'Помилка завантаження. Спробуйте пізніше.';
    });
})();
</script>
