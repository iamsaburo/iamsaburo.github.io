<style>
  @media(max-width:768px){
    #gate { margin: 1rem auto !important; }
  }
  @media(max-width:480px){
    #gate { margin: 0.75rem auto !important; }
  }
</style>

<div id="app">
  <!-- ====== Verification gate ====== -->
  <div id="gate" style="display:none; max-width:420px; margin:2rem auto 1rem; background:var(--sur); border-radius:var(--r); padding:2rem; text-align:center; box-shadow:0 0 0 1px rgba(255,255,255,0.07);">
    <img src="/svg/saburo-community.svg" width="85" height="auto" alt="SABURO"
         style="margin-bottom:1.5rem; display:block; margin-left:auto; margin-right:auto;">
    <h2 style="margin-bottom:0.5rem; font-size:1.25rem;">Цей контент доступний тільки для<br>учасників спільноти</h2>
    <p style="color:var(--muted); margin-bottom:2rem;">Будь ласка, авторизуйся<br>через Telegram або Discord.</p>

    <a id="tg-btn" class="btn-saburo" data-visual="pill"
       style="--btn-w:280px;--btn-h:48px;--radius:4px; background:#2AABEE; color:#fff !important;
              margin:0 auto 0.75rem; display:flex; align-items:center; justify-content:center; gap:8px;">
      <img src="/svg/sm_telegram.svg" width="18" height="18" alt="">
      <span class="btn-label">Продовжити через Telegram</span>
    </a>

    <p style="color:var(--muted); margin:0.75rem 0;">- або -</p>

    <a id="dc-btn" class="btn-saburo" data-visual="pill"
       style="--btn-w:280px;--btn-h:48px;--radius:4px; background:#5865F2; color:#fff !important;
              margin:0 auto 1.5rem; display:flex; align-items:center; justify-content:center; gap:8px;">
      <img src="/svg/sm_discord.svg" width="19" height="19" alt="">
      <span class="btn-label">Продовжити через Discord</span>
    </a>

    <p style="color:var(--muted); font-size:0.85rem;">Ще не з нами?<br>
      <a href="https://t.me/saburo_ua" style="color:var(--text); text-decoration:underline;">Telegram</a> |
      <a href="https://discord.gg/4BK4MBUMWh" style="color:var(--text); text-decoration:underline;">Discord</a>
    </p>
  </div>

  <!-- ====== Loading ====== -->
  <div id="loading" style="text-align:center; padding:2rem;">
    <p>Завантаження…</p>
    <div id="loading-error" style="color:#ff6b6b; display:none;"></div>
  </div>
</div>

<script>
(function() {
  // ---------- helpers ----------
  const urlParams = new URLSearchParams(window.location.search);
  let authToken = urlParams.get('token');
  if (authToken) {
    localStorage.setItem('auth_token', authToken);
    window.history.replaceState({}, document.title, window.location.pathname);
  } else {
    authToken = localStorage.getItem('auth_token');
  }

  function authFetch(url, options = {}) {
    if (authToken) {
      options.headers = options.headers || {};
      options.headers['Authorization'] = `Bearer ${authToken}`;
    }
    return fetch(url, { ...options, credentials:'include' });
  }

  function addBackButton() {
    const navLeft = document.querySelector('.nav-left');
    if (!navLeft) return;
    const btn = document.createElement('a');
    btn.className = 'btn-saburo';
    btn.setAttribute('data-visual', 'pill');
    btn.setAttribute('data-icon-visual', 'arrow_back');
    btn.setAttribute('data-icon-position', 'before');
    btn.style.cssText = '--btn-w:auto;--btn-h:32px;--radius:28px;';
    btn.href = '/';
    btn.innerHTML = `<span class="material-icons-round btn-icon-visual">arrow_back</span>
                     <span class="btn-label">Назад</span>`;
    const brand = document.querySelector('.nav-brand');
    (brand || navLeft).after(btn);
    const tagline = document.querySelector('.nav-tagline');
    if (tagline) tagline.style.display = 'none';
  }

  // ---------- routing ----------
  const path = window.location.pathname;
  const accessMatch = path.match(/^\/(.+)-access\/?$/);
  const slug = accessMatch ? accessMatch[1] : path.replace(/^\/|\/$/g, '');
  const contentContainer = document.querySelector('.content-container');

  if (!slug || slug === '404') {
    document.getElementById('loading').innerHTML = '<p>Сторінку не знайдено.</p>';
    return;
  }

  if (accessMatch) {
    // ☑ VERIFICATION GATE
    document.title = 'SABURO™ | Доступ';
    addBackButton();
    document.getElementById('loading').style.display = 'none';
    const gateEl = document.getElementById('gate');
    gateEl.style.display = 'block';
    if (contentContainer) contentContainer.style.display = 'none';

    // skip gate if already authenticated
    authFetch('https://ua.iamsaburo.workers.dev/api/check-token')
      .then(r => r.json())
      .then(data => { if (data.valid) window.location.replace('/' + slug); });

    document.getElementById('tg-btn').href = `https://t.me/saburo_community_bot?start=${slug}`;
    document.getElementById('dc-btn').href = `https://ua.iamsaburo.workers.dev/auth/discord?redirect=/` + slug;
    return;
  }

  // ☑ SECRET PAGE
  if (contentContainer) contentContainer.style.display = 'none';
  addBackButton();

  // set browser tab title
  fetch(`https://ua.iamsaburo.workers.dev/api/info/${slug}`)
    .then(r => r.json())
    .then(data => { document.title = 'SABURO™ | ' + (data.title || slug); })
    .catch(() => { document.title = 'SABURO™ | ' + slug; });

  // load parser (only if needed – currently Worker returns HTML, but we keep for fallback)
  const parserPromise = new Promise(resolve => {
    if (window.marked) return resolve();
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/marked/marked.min.js';
    s.onload = resolve;
    document.head.appendChild(s);
  });

  authFetch('https://ua.iamsaburo.workers.dev/api/check-token')
    .then(r => r.json())
    .then(data => {
      if (!data.valid) throw new Error('unauthorized');
      return authFetch(`https://ua.iamsaburo.workers.dev/api/content/${slug}`);
    })
    .then(res => {
      if (!res.ok) throw new Error('unauthorized');
      return res.text();
    })
    .then(html => {
      document.getElementById('loading').style.display = 'none';
      if (contentContainer) contentContainer.style.display = '';
      contentContainer.innerHTML = html;
      // run enhancements (tabs, copy buttons, image download)
      if (typeof window.enhanceContent === 'function') {
        window.enhanceContent(contentContainer);
      }
    })
    .catch(() => {
      localStorage.removeItem('auth_token');
      window.location.replace('/' + slug + '-access');
    });
})();
</script>
