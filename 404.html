<div id="app">
  <!-- ====== Verification gate (shown when access needed) ====== -->
  <div id="gate" style="display:none; max-width:420px; margin:2rem auto; background:var(--sur); border-radius:var(--r); padding:2rem; text-align:center; box-shadow:0 0 0 1px rgba(255,255,255,0.07);">
    <img src="/svg/logo_symbol.svg" width="60" height="60" alt="SABURO" style="margin-bottom:1.5rem;">
    <h2 style="margin-bottom:0.5rem; font-size:1.25rem;">Цей контент доступний тільки учасникам спільноти</h2>
    <p style="color:var(--muted); margin-bottom:2rem;">Будь ласка, підтвердь участь через Telegram або Discord.</p>

    <a id="tg-btn" class="btn-saburo" data-visual="pill" style="--btn-w:100%;--btn-h:48px;--radius:10px; background:#2AABEE; color:#fff !important; margin-bottom:0.75rem; display:flex; align-items:center; justify-content:center; gap:8px;">
      <img src="/svg/telegram.svg" width="20" height="20" alt="" style="flex-shrink:0;">
      <span class="btn-label">Продовжити через Telegram</span>
    </a>

    <p style="color:var(--muted); margin:0.75rem 0;">- або -</p>

    <a id="dc-btn" class="btn-saburo" data-visual="pill" style="--btn-w:100%;--btn-h:48px;--radius:10px; background:#5865F2; color:#fff !important; margin-bottom:1.5rem; display:flex; align-items:center; justify-content:center; gap:8px;">
      <img src="/svg/discord.svg" width="20" height="20" alt="" style="flex-shrink:0;">
      <span class="btn-label">Продовжити через Discord</span>
    </a>

    <p style="color:var(--muted); font-size:0.85rem;">Ще не з нами?<br>
      <a href="https://t.me/saburo_ua" style="color:var(--text);">Telegram</a> |
      <a href="https://discord.gg/4BK4MBUMWh" style="color:var(--text);">Discord</a>
    </p>
  </div>

  <!-- ====== Loading for secret page ====== -->
  <div id="loading" style="text-align:center; padding:2rem;">
    <p>Завантаження…</p>
  </div>
</div>

<script>
(function() {
  const path = window.location.pathname;
  const accessMatch = path.match(/^\/(.+)-access\/?$/);

  // ========== 1. ACCESS GATE ==========
  if (accessMatch) {
    const slug = accessMatch[1];
    const secretUrl = '/' + slug;

    document.getElementById('loading').style.display = 'none';
    document.getElementById('gate').style.display = 'block';

    // Check if already authenticated → skip gate
    fetch('https://ua.iamsaburo.workers.dev/api/check-token', { credentials:'include' })
      .then(r => r.json())
      .then(data => {
        if (data.valid) {
          window.location.replace(secretUrl);
        }
      });

    // Build Telegram button with fresh code
    fetch(`https://ua.iamsaburo.workers.dev/api/telegram-code?slug=${encodeURIComponent(slug)}`, { credentials:'include' })
      .then(r => r.json())
      .then(data => {
        document.getElementById('tg-btn').href =
          `https://ua.iamsaburo.workers.dev/auth/telegram?code=${data.code}&redirect=${encodeURIComponent(secretUrl)}`;
      })
      .catch(() => {
        document.getElementById('tg-btn').href = '#';
      });

    // Discord button (no special code needed)
    document.getElementById('dc-btn').href =
      `https://ua.iamsaburo.workers.dev/auth/discord?redirect=${encodeURIComponent(secretUrl)}`;

    return;
  }

  // ========== 2. SECRET PAGE (any other URL) ==========
  const slug = path.replace(/^\/|\/$/g, '');
  if (!slug) {
    document.getElementById('loading').innerHTML = '<p>Сторінку не знайдено.</p>';
    return;
  }

  function loadParser() {
    return new Promise(resolve => {
      if (window.marked) return resolve();
      const script = document.createElement('script');
      script.src = 'https://cdn.jsdelivr.net/npm/marked/marked.min.js';
      script.onload = resolve;
      document.head.appendChild(script);
    });
  }

  // DOM cleanup: remove stray <br> inside block-level elements and empty <p> (keep images)
  function cleanContent(container) {
    const blockElements = 'div, nav, table, ul, ol, pre, blockquote, h1, h2, h3, h4, h5, h6, section, article, header, footer, aside, figure, figcaption, details, summary, main, canvas, video, audio, form, fieldset, iframe, object, embed, math, svg, script, noscript, style, head, body, html, meta, link, title, base, hr, br, img, input, button, select, textarea, option, label, legend, datalist, output, progress, meter, template, slot, dialog, menu, menuitem, source, track, wbr, area, map, param, col, colgroup, caption, thead, tbody, tfoot, tr, td, th';

    container.querySelectorAll(blockElements).forEach(el => {
      el.querySelectorAll(':scope > br').forEach(br => br.remove());
    });

    container.querySelectorAll('p').forEach(p => {
      if (!p.textContent.trim() && !p.querySelector('img, iframe, video, svg, canvas, pre, table, div, blockquote, ul, ol, hr')) {
        p.remove();
      }
    });
  }

  loadParser()
    .then(() => {
      return fetch('https://ua.iamsaburo.workers.dev/api/check-token', { credentials:'include' })
        .then(r => r.json())
        .then(data => {
          if (!data.valid) {
            window.location.replace(`/${slug}-access`);
            return;
          }
          return fetch(`https://ua.iamsaburo.workers.dev/api/content/${slug}`, { credentials:'include' });
        });
    })
    .then(res => {
      if (!res) return;
      if (!res.ok) {
        window.location.replace(`/${slug}-access`);
        return;
      }
      return res.text();
    })
    .then(rawMarkdown => {
      if (!rawMarkdown) return;
      document.getElementById('loading').style.display = 'none';
      const contentContainer = document.querySelector('.content-container');

      const html = window.marked.parse(rawMarkdown);
      contentContainer.innerHTML = html;
      cleanContent(contentContainer);

      if (typeof window.enhanceContent === 'function') {
        window.enhanceContent(contentContainer);
      }
    })
    .catch(() => {
      document.getElementById('loading').innerHTML = '<p>Помилка завантаження. Спробуйте пізніше.</p>';
    });
})();
</script>
