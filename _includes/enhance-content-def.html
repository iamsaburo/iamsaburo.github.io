<script>
(function(){
  /* ------- Shortcode to HTML converter ------- */
  function processShortcodesHTML(html) {
    // WebM shortcode: [webm src="/path/file.webm" width="800" height="450"]
    html = html.replace(
      /\[webm\s+src="([^"]+)"(?:\s+width="(\d+)")?(?:\s+height="(\d+)")?\s*\]/gi,
      function(_, src, w, h) {
        var wAttr = w ? 'width="' + w + '"' : '';
        var hAttr = h ? 'height="' + h + '"' : '';
        return '<video autoplay loop muted playsinline ' + wAttr + ' ' + hAttr +
               ' style="border-radius:4px; max-width:100%; display:block;">' +
               '<source src="' + src + '" type="video/webm"></video>';
      }
    );

    // Button shortcode: [button text="Label" url="https://..." color="#ff0000"]
    html = html.replace(
      /\[button\s+text="([^"]+)"\s+url="([^"]+)"(?:\s+color="([^"]+)")?\s*\]/gi,
      function(_, text, url, color) {
        return '<a href="' + url + '" class="custom-button"' +
               (color ? ' style="background:' + color + '"' : '') + '>' + text + '</a>';
      }
    );

    // Video shortcode: [video src="URL" type="youtube"] or type="mp4"
    html = html.replace(
      /\[video\s+src="([^"]+)"\s+type="([^"]+)"\]/gi,
      function(_, src, type) {
        if (type === 'youtube') {
          return '<div class="video-embed"><iframe src="' + src +
                 '" frameborder="0" allowfullscreen></iframe></div>';
        } else {
          return '<video controls><source src="' + src +
                 '" type="video/mp4"></video>';
        }
      }
    );

    // Tabs shortcode: [tabs] [tab name="Tab 1"] content [/tabs]
    html = html.replace(
      /\[tabs\]([\s\S]*?)\[\/tabs\]/gi,
      function(_, inner) {
        var parts = inner.split(/\[tab\s+name="([^"]+)"\]/).filter(Boolean);
        var headers = '';
        var contents = '';
        for (var i = 0; i < parts.length; i += 2) {
          var name = parts[i].trim();
          var body = (parts[i + 1] || '').trim();
          var id = 'tab-' + Math.floor(i / 2);
          var isActive = (i === 0) ? ' active' : '';
          var ariaSel = (i === 0) ? 'true' : 'false';
          headers += '<button class="tab-btn' + isActive +
                     '" data-tab="' + id + '" role="tab" aria-selected="' + ariaSel + '">' +
                     name + '</button>';
          contents += '<div class="tab-panel' + isActive +
                      '" data-tab="' + id + '">' + body + '</div>';
        }
        return '<div class="inline-tabs"><nav class="tabs-nav" role="tablist">' +
               headers + '</nav>' + contents + '</div>';
      }
    );

    return html;
  }

  window.enhanceContent = function(root) {
    root = root || document;

    /* ----- 1. Process shortcodes in the main content container ----- */
    var contentContainer = root.querySelector('.content-container');
    if (contentContainer) {
      contentContainer.innerHTML = processShortcodesHTML(contentContainer.innerHTML);
    }

    /* ----- 2. Responsive iframes & images ----- */
    root.querySelectorAll('.content-container iframe').forEach(iframe => {
      const w = parseInt(iframe.getAttribute('width')  || '0', 10);
      const h = parseInt(iframe.getAttribute('height') || '0', 10);
      if (w && h) iframe.style.aspectRatio = `${w} / ${h}`;
      iframe.removeAttribute('width');
      iframe.removeAttribute('height');
      iframe.style.width    = '100%';
      iframe.style.maxWidth = '100%';
      iframe.style.display  = 'block';
    });

    root.querySelectorAll('.content-container img[width]').forEach(img => {
      img.removeAttribute('width');
      img.removeAttribute('height');
    });

    /* ----- 3. Code copy (pre blocks) ----- */
    root.querySelectorAll('.content-container pre').forEach(pre => {
      if (pre.querySelector('.copy-btn')) return;
      const btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.innerHTML = '<span class="material-icons-round">content_copy</span>Скопіювати';
      btn.addEventListener('click', () => {
        const code = pre.querySelector('code');
        navigator.clipboard.writeText(code ? code.innerText : pre.innerText).then(() => {
          btn.classList.add('copied');
          btn.innerHTML = '<span class="material-icons-round">check</span>Скопійовано';
          setTimeout(() => {
            btn.classList.remove('copied');
            btn.innerHTML = '<span class="material-icons-round">content_copy</span>Скопіювати';
          }, 2000);
        });
      });
      pre.appendChild(btn);
    });

    /* ----- 4. Inline code copy (+ toast) ----- */
    const toast = root.querySelector('.copy-toast') || (function(){
      const t = document.createElement('div');
      t.className = 'copy-toast';
      t.innerHTML = '<span class="material-icons-round">check</span>Скопійовано';
      document.body.appendChild(t);
      return t;
    })();
    let toastTimer;
    function showToast(anchorEl) {
      clearTimeout(toastTimer);
      const rect    = anchorEl.getBoundingClientRect();
      const scrollY = window.scrollY || 0;
      const scrollX = window.scrollX || 0;
      toast.style.left = (rect.left + scrollX + rect.width / 2) + 'px';
      toast.style.top  = (rect.top  + scrollY) + 'px';
      toast.classList.add('show');
      toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
    }
    root.querySelectorAll('.content-container :not(pre) > code').forEach(code => {
      if (code._wired) return;
      code._wired = true;
      code.title = 'Клікни щоб скопіювати';
      code.addEventListener('click', () =>
        navigator.clipboard.writeText(code.innerText).then(() => showToast(code))
      );
    });

    /* ----- 5. Image download buttons ----- */
    root.querySelectorAll('.content-container img').forEach(img => {
      if (img.classList.contains('tab-icon-svg')) return;
      if (img.closest('#gate, .tabs-nav, .navbar, footer, .img-wrap')) return;
      const w = parseInt(img.getAttribute('width') || '9999');
      if (w < 64) return;
      if (img.parentNode.classList.contains('img-wrap')) return;

      const wrap = document.createElement('span');
      wrap.className = 'img-wrap';
      img.parentNode.insertBefore(wrap, img);
      wrap.appendChild(img);

      const dlBtn = document.createElement('a');
      dlBtn.className = 'img-dl-btn';
      dlBtn.href = img.src;
      dlBtn.download = img.alt || 'image';
      dlBtn.title = 'Завантажити';
      dlBtn.setAttribute('target','_blank');
      dlBtn.innerHTML = '<span class="material-icons-round">download</span>';
      dlBtn.addEventListener('click', e => e.stopPropagation());
      wrap.appendChild(dlBtn);
    });

    /* ----- 6. Inline tabs switching ----- */
    root.querySelectorAll('.inline-tabs').forEach(widget => {
      if (widget.dataset.enhanced === 'true') return;
      widget.dataset.enhanced = 'true';

      const btns   = Array.from(widget.querySelectorAll(':scope > .tabs-nav .tab-btn'));
      const panels = Array.from(widget.querySelectorAll(':scope > .tab-panel'));
      btns.forEach(btn => {
        btn.addEventListener('click', () => {
          const t = btn.dataset.tab;
          btns.forEach(b => { b.classList.remove('active'); b.setAttribute('aria-selected','false'); });
          panels.forEach(p => p.classList.remove('active'));
          btn.classList.add('active');
          btn.setAttribute('aria-selected','true');
          const panel = widget.querySelector(':scope > .tab-panel[data-tab="'+t+'"]');
          if (panel) panel.classList.add('active');
        });
      });
    });

    /* ----- 7. GIF lazy loading for block cards ----- */
    const isMobile = window.matchMedia('(hover:none)').matches;
    const cards    = root.querySelectorAll('.block-card');
    if (!isMobile) {
      cards.forEach(card => {
        const gifImg = card.querySelector('.gif-img');
        if (!gifImg) return;
        const gifSrc = gifImg.dataset.src;
        if (!gifSrc) return;
        let loaded = false;
        card.addEventListener('mouseenter', () => {
          if (loaded){ card.classList.add('gif-ready'); }
          else {
            gifImg.src = gifSrc;
            gifImg.addEventListener('load', () => {
              loaded = true;
              if (card.matches(':hover')) card.classList.add('gif-ready');
            }, { once:true });
          }
        });
        card.addEventListener('mouseleave', () => card.classList.remove('gif-ready'));
      });
    } else {
      cards.forEach(card => {
        const gifImg = card.querySelector('.gif-img');
        if (!gifImg) return;
        const gifSrc = gifImg.dataset.src;
        if (gifSrc) gifImg.src = gifSrc;
      });
      let activeCard = null;
      const observer = new IntersectionObserver(entries => {
        let best = null, bestRatio = 0;
        entries.forEach(e => { if (e.intersectionRatio > bestRatio){ bestRatio = e.intersectionRatio; best = e.target; } });
        if (best && bestRatio > 0.5){
          if (activeCard && activeCard !== best) activeCard.classList.remove('gif-ready');
          best.classList.add('gif-ready');
          activeCard = best;
        }
      }, { threshold:[0,.25,.5,.75,1] });
      cards.forEach(card => observer.observe(card));
    }
  };
})();
</script>
