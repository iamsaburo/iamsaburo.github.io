---
layout: null
---
<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <title>{{ page.title }} — SABURO</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <style>
    /* Same CSS as homepage (navbar, footer, buttons, content styles) */
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#141414;
      --sur:#1A1A1A;
      --sur2:#222;
      --pill:#303030;
      --text:#fff;
      --muted:#ADADAD;
      --border:rgba(255,255,255,.06);
      --r:17px;
      --chroma:linear-gradient(65deg,
        #9C96FF 0%,#9FE5F6 6%,#E4FFA8 12%,#FCFF91 20%,
        #CCFFBF 28%,#C2FAAB 36%,#E0E1C9 44%,#F3CDDA 52%,
        #FFBED0 60%,#F8C2FF 68%,#CFFFFA 76%,#A5F3FF 84%,
        #A0BBFF 92%,#9C96FF 100%);
      --pad:248px
    }
    body{
      background:var(--bg);color:var(--text);
      font-family:'Inter',system-ui,sans-serif;
      min-height:100vh;line-height:1.6;
      -webkit-font-smoothing:antialiased
    }
    a{color:inherit;text-decoration:none}
    .navbar{
      position:sticky;top:0;z-index:100;
      height:56px;background:var(--sur);
      display:flex;align-items:center;
      padding:0 var(--pad)
    }
    .nav-left{display:flex;align-items:center;gap:35px}
    .nav-brand{display:flex;align-items:center;gap:14px}
    .nav-wordmark{
      display:flex;align-items:center;gap:6px;
      font-size:1rem;font-weight:500;letter-spacing:1px
    }
    .nav-right{margin-left:auto;display:flex;align-items:center;gap:30px}
    .nav-join{font-size:1rem;letter-spacing:1px}
    .social-row{display:flex;align-items:center;gap:18px}
    .social-row a{display:flex;align-items:center;opacity:.8;transition:opacity .2s}
    .social-row a:hover{opacity:1}
    .btn-pill{
      display:inline-flex;align-items:center;gap:6px;
      padding:0 14px;height:32px;border-radius:28px;
      background:var(--pill);color:var(--text);
      font:400 1rem/1 'Inter',system-ui;letter-spacing:.06em;
      border:none;cursor:pointer;text-decoration:none;
      transition:background .2s;white-space:nowrap
    }
    .btn-pill:hover{background:#404040}
    .btn-pill .material-icons-round{font-size:1rem}
    footer{
      background:var(--sur);height:56px;
      display:flex;align-items:center;
      padding:0 var(--pad);
      margin-top:4rem;
      position:relative
    }
    .footer-copy{color:var(--muted);font-size:1rem;font-weight:500;letter-spacing:1px}
    .footer-center{
      position:absolute;left:50%;transform:translateX(-50%);
      display:flex;align-items:center;gap:8px
    }
    .btn-support{
      display:inline-flex;align-items:center;gap:8px;
      height:32px;padding:0 14px;border-radius:28px;
      background:var(--pill);color:var(--text);
      font:400 1rem/1 'Inter',system-ui;letter-spacing:1px;
      border:none;cursor:pointer;text-decoration:none;
      transition:background .2s
    }
    .btn-support:hover{background:#404040}
    .btn-support .material-icons-round{font-size:1.1rem;color:#FFBC40}
    .footer-right{margin-left:auto;color:var(--muted);font-size:1rem;font-weight:500;letter-spacing:1px}
    @media (max-width:768px){
      .navbar{padding:0 1rem}
      .nav-wordmark{display:none}
      .nav-join{display:none}
      .social-row{gap:12px}
      footer{height:auto;padding:.75rem 1rem;flex-wrap:wrap;gap:.5rem}
      .footer-center{position:static;transform:none}
      :root{--pad:1rem}
    }
    /* Content area */
    .page-content{
      max-width:860px;margin:2rem auto;padding:0 1rem
    }
    .back-row{ margin-bottom:1.5rem }
    .card{
      background:var(--sur);
      border:1px solid var(--border);
      border-radius:var(--r);
      padding:2rem
    }
    .card h1{font-size:1.75rem;font-weight:700;color:#fff;margin-bottom:1.5rem}
    .markdown-body{color:var(--text);line-height:1.8}
    .markdown-body img{max-width:100%;border-radius:8px}
    /* etc */
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
  <div class="nav-left">
    <a href="/" class="nav-brand">
      <!-- Symbol only (visible on mobile too) -->
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><g clip-path="url(#sc)"><path d="M12 0C18.6274 0 24 5.37258 24 12C24 18.6274 18.6274 24 12 24C5.37258 24 0 18.6274 0 12C0 5.37258 5.37258 0 12 0ZM10.7725 5.16016C10.6004 5.16016 10.4621 5.29995 10.4521 5.47168C10.2968 8.15118 8.15119 10.2968 5.47168 10.4521C5.29995 10.4621 5.16016 10.6004 5.16016 10.7725V13.3984C5.16021 13.5704 5.2997 13.71 5.47168 13.71H9.97852C10.1505 13.71 10.29 13.8495 10.29 14.0215V18.5283C10.29 18.7003 10.4295 18.8398 10.6016 18.8398H13.2275C13.3996 18.8398 13.5379 18.7 13.5479 18.5283C13.7031 15.8487 15.8487 13.7032 18.5283 13.5479C18.7 13.5379 18.8398 13.3996 18.8398 13.2275V10.6016C18.8398 10.4295 18.7003 10.29 18.5283 10.29H14.0215C13.8495 10.29 13.71 10.1505 13.71 9.97852V5.47168C13.71 5.29968 13.5704 5.16017 13.3984 5.16016H10.7725Z" fill="white"/></g></svg>
      <div class="nav-wordmark">
        <svg width="97" height="21" viewBox="0 0 97 21" fill="none">... <!-- same wordmark --></svg>
        <span style="opacity:.35;padding:0 4px;">|</span>
        <span>Корисне</span>
      </div>
    </a>
    {% if page.back_url %}
    <a href="{{ page.back_url }}" class="btn-pill">
      <span class="material-icons-round">arrow_back</span>{{ page.back_label | default: 'Головна' }}
    </a>
    {% endif %}
  </div>
  <div class="nav-right">
    <!-- social icons as in homepage -->
    <span class="nav-join">Приєднуйся:</span>
    <div class="social-row">
      <!-- same SVGs -->
    </div>
  </div>
</nav>

<div class="page-content">
  <div class="card">
    <h1>{{ page.title }}</h1>
    <div class="markdown-body">{{ content | markdownify }}</div>
    <a href="https://ua.iamsaburo.workers.dev/{{ page.slug }}" class="btn-primary" style="margin-top:2rem">
      <span class="btn-label">Access Community</span>
    </a>
  </div>
</div>

<footer>
  <span class="footer-copy">© {{ site.time | date: "%Y" }} SABURO™</span>
  <div class="footer-center">
    <a href="{{ site.support_url | default: '#' }}" class="btn-support">
      <span class="material-icons-round">favorite</span>Підтримати Мене
    </a>
  </div>
  <span class="footer-right">Для своїх 🇺🇦</span>
</footer>
</body>
</html>
