<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SABURO™ | {{ page.title | default: site.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#141414;--sur:#1A1A1A;--sur2:#222;--pill:#303030;
      --text:#fff;--muted:#ADADAD;--border:rgba(255,255,255,.06);--r:17px;
      --chroma:linear-gradient(65deg,
        #9C96FF 0%,#9FE5F6 6%,#E4FFA8 12%,#FCFF91 20%,
        #CCFFBF 28%,#C2FAAB 36%,#E0E1C9 44%,#F3CDDA 52%,
        #FFBED0 60%,#F8C2FF 68%,#CFFFFA 76%,#A5F3FF 84%,
        #A0BBFF 92%,#9C96FF 100%);
      --pad:248px
    }
    body{
      background:var(--bg);color:var(--text);
      font-family:'Inter',system-ui,sans-serif;
      min-height:100vh;line-height:1.6;
      -webkit-font-smoothing:antialiased;
      display:flex;flex-direction:column
    }
    a{color:inherit;text-decoration:none}
    .ph-img{display:inline-block;flex-shrink:0}
    .page-wrap{flex:1}

    /* Pill back button */
    .btn-pill{
      display:inline-flex;align-items:center;gap:8px;
      padding:0 14px;height:32px;border-radius:28px;
      background:var(--pill);color:var(--text);
      font:400 1rem/1 'Inter',system-ui;letter-spacing:.06em;
      border:none;cursor:pointer;text-decoration:none;
      transition:background .2s;white-space:nowrap
    }
    .btn-pill:hover{background:#404040}
    .btn-pill .material-icons-round{font-size:1.125rem}

    /* Secondary white button */
    .btn-secondary{
      display:inline-flex;align-items:center;gap:.45rem;
      padding:.7rem 1.4rem;border-radius:10px;
      background:#fff;color:#111;
      font:600 .95rem/1 'Inter',system-ui;letter-spacing:.04em;
      box-shadow:0 2px 10px rgba(0,0,0,.3);
      border:none;cursor:pointer;text-decoration:none;
      transition:transform .2s,box-shadow .2s;white-space:nowrap
    }
    .btn-secondary:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(0,0,0,.4);color:#111}
    .btn-secondary .material-icons-round{font-size:1.1rem}

    /* Primary chroma button (access pages) */
    .btn-primary{
      display:inline-flex;align-items:center;justify-content:center;
      gap:.5rem;padding:.7rem 1.4rem;border-radius:10px;
      background:#fff;color:#111;
      font:600 .95rem/1 'Inter',system-ui;letter-spacing:.04em;
      box-shadow:0 2px 10px rgba(0,0,0,.3);
      border:none;cursor:pointer;text-decoration:none;
      position:relative;z-index:0;
      transition:transform .2s,box-shadow .2s
    }
    .btn-primary .btn-label{position:relative;z-index:2;transition:color .3s;pointer-events:none}
    .btn-primary::before{
      content:'';position:absolute;inset:0;border-radius:10px;
      background:var(--chroma);background-size:200% 100%;
      animation:chromaSlide 3s linear infinite;
      opacity:0;transition:opacity .35s;z-index:1
    }
    .btn-primary::after{
      content:'';position:absolute;inset:-8px;border-radius:18px;
      background:var(--chroma);background-size:200% 100%;
      animation:chromaSlide 3s linear infinite;
      filter:blur(16px);opacity:0;transition:opacity .35s;z-index:-1
    }
    .btn-primary:hover::before{opacity:1}
    .btn-primary:hover::after{opacity:.75}
    .btn-primary:hover .btn-label{color:#fff}
    .btn-primary:hover{transform:translateY(-2px);box-shadow:none}
    .btn-primary .material-icons-round{position:relative;z-index:2;transition:color .3s}
    .btn-primary:hover .material-icons-round{color:#fff}

    @keyframes chromaSlide{0%{background-position:0% 50%}100%{background-position:100% 50%}}

    /* Navbar */
    .navbar{
      position:sticky;top:0;z-index:100;
      height:56px;background:var(--sur);
      display:flex;align-items:center;
      padding:0
    }
    .nav-container{
      max-width:1425px;width:100%;margin:0 auto;
      display:flex;align-items:center;height:100%;
      padding:0 1rem
    }
    .nav-left{display:flex;align-items:center;gap:35px}
    .nav-brand{display:flex;align-items:center;gap:14px}
    .nav-wordmark{display:flex;align-items:center;gap:6px;font-size:1rem;font-weight:500;letter-spacing:.06em;white-space:nowrap}
    .nav-wordmark .sep{opacity:.35;padding:0 4px}
    .nav-right{margin-left:auto;display:flex;align-items:center;gap:30px}
    .nav-join{font-size:1rem;letter-spacing:.06em;white-space:nowrap}
    .social-row{display:flex;align-items:center;gap:18px}
    .social-row a{display:flex;align-items:center;opacity:.8;transition:opacity .2s}
    .social-row a:hover{opacity:1}

    /* Hero */
    .hero{
      text-align:center;padding:4.5rem 1rem 1.5rem;
    }
    .hero h1{
      font-size:5rem;font-weight:700;letter-spacing:.02em;line-height:1.2;
      margin-bottom:.5rem;color:#fff
    }
    .hero h1 .design{
      cursor:pointer;position:relative;
      transition:background .3s, -webkit-text-fill-color .3s;
      transition:background .3s, text-fill-color .3s;
      display:inline-block
    }
    .hero h1 .design::after{
      content:'';
      position:absolute;
      top:50%;left:50%;
      width:120%;height:120%;
      transform:translate(-50%,-50%);
      background:var(--chroma);
      background-size:200% 100%;
      filter:blur(20px);
      border-radius:50%;
      opacity:0;
      z-index:-1;
      transition:opacity .3s;
      animation:chromaSlide 3s linear infinite paused
    }
    .hero h1 .design:hover{
      background:var(--chroma);
      background-size:200% auto;
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      background-clip:text;
      animation:chromaSlide 3s linear infinite
    }
    .hero h1 .design:hover::after{
      opacity:.8;
      animation-play-state:running
    }
    @media (hover: none){
      .hero h1 .design{
        background:var(--chroma);
        background-size:200% auto;
        -webkit-background-clip:text;
        -webkit-text-fill-color:transparent;
        background-clip:text;
        animation:chromaSlide 3s linear infinite
      }
    }
    .hero p{
      font-size:1rem;color:var(--muted);
      letter-spacing:.06em;max-width:650px;margin:0 auto
    }

    /* Filter */
    .filter-wrap{
      display:flex;justify-content:center;
      margin:1.5rem auto 2rem;padding:0 1rem
    }
    .filter-bar{
      display:flex;align-items:center;gap:2px;
      background:var(--sur);border-radius:40px;
      padding:5px;overflow-x:auto;
      position:relative
    }
    .filter-highlight{
      position:absolute;
      top:5px;
      height:34px;
      background:var(--bg);
      border-radius:28px;
      transition:left .3s ease,width .3s ease;
      z-index:0;
      pointer-events:none
    }
    .filter-btn{
      display:flex;align-items:center;gap:6px;
      padding:0 14px;height:34px;border-radius:28px;
      background:transparent;color:var(--text);
      font:400 .9rem/1 'Inter',system-ui;letter-spacing:.04em;
      border:none;cursor:pointer;white-space:nowrap;flex-shrink:0;
      position:relative;z-index:1
    }
    .filter-btn.active{background:transparent;color:var(--text)}
    .filter-btn .f-label{display:none;font-weight:500}
    .filter-btn.active .f-label{display:inline}

    /* Card grid */
    .block-grid{
      display:grid;
      grid-template-columns:repeat(4,330px);
      gap:35px;
      justify-content:center;
      max-width:1425px;
      margin:0 auto;
      padding:0 0 2rem
    }
    @media (max-width:1425px){
      .block-grid{padding:0 1rem 2rem}
    }
    .block-card{
      background:var(--sur);border-radius:var(--r);
      padding:20px;
      transition:transform .25s,background .25s;
      display:flex;flex-direction:column;
      text-decoration:none;color:inherit
    }
    .block-card:hover{transform:translateY(-4px);background:var(--sur2)}
    .image-wrapper{
      width:100%;aspect-ratio:290/187;
      border-radius:8px;overflow:hidden;
      margin-bottom:20px;position:relative;background:#0d0d0d
    }
    .image-wrapper img{
      width:100%;height:100%;object-fit:cover;
      position:absolute;top:0;left:0;transition:opacity .35s
    }
    .image-wrapper .static-img{opacity:1}
    .image-wrapper .gif-img{opacity:0}
    .block-card:hover .image-wrapper .static-img{opacity:0}
    .block-card:hover .image-wrapper .gif-img{opacity:1}
    .card-title{
      font-size:1.125rem;font-weight:700;color:#fff;
      margin-bottom:8px;letter-spacing:.03em
    }
    .tags-row{
      display:flex;gap:0;
      margin:35px 0;
      height:34px;align-items:center
    }
    .tag-circle{
      width:34px;height:34px;border-radius:50%;
      background:#141414;display:flex;align-items:center;
      justify-content:center;margin-right:8px;position:relative;z-index:1
    }
    .tag-circle:last-child{margin-right:0}

    /* Hover button (block cards) */
    .btn-wrap{
      position:relative;
      margin-top:auto;
      border-radius:4px;
    }
    .btn-wrap::after{
      content:'';
      position:absolute;inset:0;
      border-radius:4px;
      background:var(--chroma);
      background-size:200% 100%;
      filter:blur(7.5px);
      opacity:0;
      transition:opacity .35s;
      z-index:-1
    }
    .block-card:hover .btn-wrap::after{opacity:1}

    .btn-chroma{
      display:flex;align-items:center;justify-content:center;
      height:40px;width:100%;
      background:transparent;
      color:var(--text);
      font-weight:600;font-size:.95rem;letter-spacing:.04em;
      text-decoration:none;
      border-radius:4px;
      outline:2px solid rgba(255,255,255,0.6);
      outline-offset:-2px;
      position:relative;
      overflow:hidden;
      z-index:0;
      gap:0;
      transition:background .3s,color .3s;
    }
    .btn-chroma::before{
      content:'';
      position:absolute;
      width:240px;height:293px;
      top:90.5px;left:-48px;
      background:linear-gradient(90deg,
        #9C96FF 0%,#9FE5F6 6%,#E4FFA8 12%,#FCFF91 20%,
        #CCFFBF 28%,#C2FAAB 36%,#E0E1C9 44%,#F3CDDA 52%,
        #FFBED0 60%,#F8C2FF 68%,#CFFFFA 76%,#A5F3FF 84%,
        #A0BBFF 92%,#9C96FF 100%);
      transform:rotate(-65deg) translateX(-70%);
      animation:stripSlide 3s linear infinite paused;
      opacity:0;
      transition:opacity .3s;
      z-index:1;
    }
    .block-card:hover .btn-chroma{
      background:#fff;
      color:#111;
    }
    .block-card:hover .btn-chroma::before{
      animation-play-state:running;
      opacity:1;
    }
    @keyframes stripSlide{
      0%{transform:rotate(-65deg) translateX(-70%)}
      100%{transform:rotate(-65deg) translateX(70%)}
    }

    .btn-chroma .btn-label{
      position:relative;z-index:2;
      transition:margin-right .3s;
      text-shadow:0 1px 0 rgba(255,255,255,.6);
    }
    .btn-chroma .material-icons-round{
      display:inline-flex;align-items:center;
      overflow:hidden;width:0;
      transition:width .3s,opacity .3s;
      opacity:0;
      position:relative;z-index:2;
      font-size:1.25rem;
      text-shadow:0 1px 0 rgba(255,255,255,.6);
    }
    .block-card:hover .material-icons-round{
      width:24px;opacity:1;
    }
    .block-card:hover .btn-label{
      margin-right:8px;
    }

    /* No results & pagination */
    .no-results{
      text-align:center;padding:3rem 1rem;
      color:var(--muted);grid-column:1/-1
    }
    .pagination{
      display:flex;justify-content:center;align-items:center;
      gap:.6rem;padding:1.5rem 0 3rem;flex-wrap:wrap
    }
    .page-btn{
      width:40px;height:40px;border-radius:50%;
      background:var(--sur);color:var(--text);
      display:flex;align-items:center;justify-content:center;
      border:none;cursor:pointer;font-weight:600;font-size:.95rem;
      font-family:'Inter',system-ui;transition:background .2s
    }
    .page-btn.active{background:var(--pill)}
    .page-btn:hover{background:#404040}
    .page-btn:disabled{opacity:.35;cursor:default;pointer-events:none}

    /* Footer */
    footer{
      height:56px;background:var(--sur);
      display:flex;align-items:center;
      padding:0;margin-top:2rem;
      position:relative;flex-shrink:0
    }
    .footer-container{
      max-width:1425px;width:100%;margin:0 auto;
      display:flex;align-items:center;height:100%;
      padding:0 1rem;box-sizing:border-box
    }
    .footer-copy{color:var(--muted);font-size:1rem;font-weight:500;letter-spacing:.06em}
    .footer-center{position:absolute;left:50%;transform:translateX(-50%)}
    .btn-support{
      display:inline-flex;align-items:center;gap:8px;
      height:32px;padding:0 14px;border-radius:28px;
      background:var(--pill);color:var(--text);
      font:400 1rem/1 'Inter',system-ui;letter-spacing:.06em;
      border:none;cursor:pointer;text-decoration:none;
      transition:background .2s
    }
    .btn-support:hover{background:#404040}
    .btn-support .heart-icon{font-family:'Material Icons Round';font-size:1.1rem;color:#FFBC40}
    .footer-right{margin-left:auto;color:var(--muted);font-size:1rem;font-weight:500;letter-spacing:.06em}

    /* Responsive */
    @media (max-width:1400px){.navbar{padding:0}footer{padding:0}}
    @media (max-width:1024px){.hero h1{font-size:3rem}}
    @media (max-width:768px){
      .navbar{padding:0}
      .nav-wordmark{display:none}
      .nav-join{display:none}
      .social-row{gap:12px}
      .nav-left{gap:12px}
      .block-grid{grid-template-columns:1fr;max-width:100%;gap:1.5rem;padding:0 1rem 2rem}
      .hero h1{font-size:2.2rem}
      .hero{padding:2.5rem 1rem 1rem}
      footer{height:auto;padding:.75rem 0}
      .footer-container{flex-wrap:wrap;gap:.5rem;height:auto}
      .footer-center{position:static;transform:none;order:3;width:100%;display:flex;justify-content:center}
      .footer-copy,.footer-right{font-size:.85rem}
    }
    @media (max-width:480px){
      .hero h1{font-size:1.7rem}
      .social-row{gap:8px}
    }
  </style>
  {% if page.extra_css %}{{ page.extra_css }}{% endif %}
</head>
<body>
<nav class="navbar">
  <div class="nav-container">
    <div class="nav-left">
      <a href="/" class="nav-brand">
        <img src="{{ '/svg/logo_symbol.svg' | relative_url }}" width="24" height="24" alt="лого" class="ph-img">
        <div class="nav-wordmark">
          <img src="{{ '/svg/logo_word-mark.svg' | relative_url }}" width="97" height="21" alt="SABURO" class="ph-img">
          <span class="sep">|</span>
          <span>Корисне</span>
        </div>
      </a>
      {% if page.back_url %}
      <a href="{{ page.back_url }}" class="btn-pill">
        <span class="material-icons-round">arrow_back</span>{{ page.back_label | default: 'Головна' }}
      </a>
      {% endif %}
    </div>
    <div class="nav-right">
      <span class="nav-join">Приєднуйся:</span>
      <div class="social-row">
        <a href="https://twitch.tv/iamsaburo" target="_blank" rel="noopener" title="Twitch">
          <img src="{{ '/svg/sm_twitch.svg' | relative_url }}" width="14" height="16" alt="">
        </a>
        <a href="https://t.me/iamsaburo" target="_blank" rel="noopener" title="Telegram">
          <img src="{{ '/svg/sm_telegram.svg' | relative_url }}" width="17" height="14" alt="">
        </a>
        <a href="https://discord.gg/iamsaburo" target="_blank" rel="noopener" title="Discord">
          <img src="{{ '/svg/sm_discord.svg' | relative_url }}" width="17" height="13" alt="">
        </a>
        <a href="https://youtube.com/@iamsaburo" target="_blank" rel="noopener" title="YouTube">
          <img src="{{ '/svg/sm_youtube.svg' | relative_url }}" width="17" height="12" alt="">
        </a>
        <a href="https://tiktok.com/@iamsaburo" target="_blank" rel="noopener" title="TikTok">
          <img src="{{ '/svg/sm_tiktok.svg' | relative_url }}" width="12" height="14" alt="">
        </a>
      </div>
    </div>
  </div>
</nav>
<div class="page-wrap">
  {{ content }}
</div>
<footer>
  <div class="footer-container">
    <span class="footer-copy">© {{ site.time | date: "%Y" }} SABURO™</span>
    <div class="footer-center">
      <a href="https://patreon.com/iamsaburo" class="btn-support">
        <span class="heart-icon">favorite</span>Підтримати Мене
      </a>
    </div>
    <span class="footer-right">Для своїх 🇺🇦</span>
  </div>
</footer>
</body>
</html>
