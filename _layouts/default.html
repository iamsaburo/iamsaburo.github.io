<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }} — SABURO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#141414;
      --sur:#1A1A1A;
      --sur2:#222;
      --pill:#303030;
      --text:#fff;
      --muted:#ADADAD;
      --border:rgba(255,255,255,.06);
      --r:17px;
      --chroma:linear-gradient(65deg,
        #9C96FF 0%,#9FE5F6 6%,#E4FFA8 12%,#FCFF91 20%,
        #CCFFBF 28%,#C2FAAB 36%,#E0E1C9 44%,#F3CDDA 52%,
        #FFBED0 60%,#F8C2FF 68%,#CFFFFA 76%,#A5F3FF 84%,
        #A0BBFF 92%,#9C96FF 100%);
      --pad:248px;
    }
    body{
      background:var(--bg);color:var(--text);
      font-family:'Inter',system-ui,sans-serif;
      min-height:100vh;line-height:1.6;
      -webkit-font-smoothing:antialiased
    }
    a{color:inherit;text-decoration:none}
    img{display:block;max-width:100%}
    .ph-svg{display:inline-flex;align-items:center;justify-content:center}
    .ph-svg svg{width:100%;height:100%}

    /* Pill button */
    .btn-pill{
      display:inline-flex;align-items:center;gap:8px;
      padding:0 14px;height:32px;border-radius:28px;
      background:var(--pill);color:var(--text);
      font:400 1rem/1 'Inter',system-ui;letter-spacing:.06em;
      border:none;cursor:pointer;text-decoration:none;
      transition:background .2s;white-space:nowrap
    }
    .btn-pill:hover{background:#404040}
    .btn-pill .material-icons-round{font-size:1.125rem}

    /* Secondary button */
    .btn-secondary{
      display:inline-flex;align-items:center;gap:.45rem;
      padding:.7rem 1.4rem;border-radius:10px;
      background:#fff;color:#111;
      font:600 .95rem/1 'Inter',system-ui;letter-spacing:.04em;
      box-shadow:0 2px 10px rgba(0,0,0,.3);
      border:none;cursor:pointer;text-decoration:none;
      transition:transform .2s,box-shadow .2s;white-space:nowrap
    }
    .btn-secondary:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(0,0,0,.4);color:#111}
    .btn-secondary .material-icons-round{font-size:1.1rem}

    /* Chroma primary button */
    .btn-primary{
      display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
      padding:.7rem 1.4rem;border-radius:10px;
      background:#fff;color:#111;
      font:600 .95rem/1 'Inter',system-ui;letter-spacing:.04em;
      box-shadow:0 2px 10px rgba(0,0,0,.3);
      border:none;cursor:pointer;text-decoration:none;
      position:relative;z-index:0;
      transition:transform .2s,box-shadow .2s
    }
    .btn-primary .btn-label{position:relative;z-index:2;transition:color .3s;pointer-events:none}
    .btn-primary::before{
      content:'';position:absolute;inset:0;border-radius:10px;
      background:var(--chroma);background-size:200% 100%;
      animation:chromaSlide 3s linear infinite;
      opacity:0;transition:opacity .35s;z-index:1
    }
    .btn-primary::after{
      content:'';position:absolute;inset:-8px;border-radius:18px;
      background:var(--chroma);background-size:200% 100%;
      animation:chromaSlide 3s linear infinite;
      filter:blur(16px);opacity:0;transition:opacity .35s;z-index:-1
    }
    .btn-primary:hover::before{opacity:1}
    .btn-primary:hover::after{opacity:.75}
    .btn-primary:hover .btn-label{color:#fff}
    .btn-primary:hover{transform:translateY(-2px);box-shadow:none}
    .btn-primary .material-icons-round{position:relative;z-index:2;transition:color .3s}
    .btn-primary:hover .material-icons-round{color:#fff}

    @keyframes chromaSlide{0%{background-position:0% 50%}100%{background-position:100% 50%}}

    /* Navbar */
    .navbar{
      position:sticky;top:0;z-index:100;
      height:56px;background:var(--sur);
      display:flex;align-items:center;
      padding:0 var(--pad)
    }
    .nav-left{display:flex;align-items:center;gap:35px}
    .nav-brand{display:flex;align-items:center;gap:14px}
    .nav-wordmark{display:flex;align-items:center;gap:6px;font-size:1rem;font-weight:500;letter-spacing:.06em;white-space:nowrap}
    .nav-wordmark .sep{opacity:.35;padding:0 4px}
    .nav-right{margin-left:auto;display:flex;align-items:center;gap:30px}
    .nav-join{font-size:1rem;letter-spacing:.06em;white-space:nowrap}
    .social-row{display:flex;align-items:center;gap:18px}
    .social-row a{display:flex;align-items:center;opacity:.8;transition:opacity .2s}
    .social-row a:hover{opacity:1}

    /* Footer */
    footer{
      height:56px;background:var(--sur);
      display:flex;align-items:center;
      padding:0 var(--pad);margin-top:2rem;
      position:relative
    }
    .footer-copy{color:var(--muted);font-size:1rem;font-weight:500;letter-spacing:.06em}
    .footer-center{position:absolute;left:50%;transform:translateX(-50%)}
    .btn-support{
      display:inline-flex;align-items:center;gap:8px;
      height:32px;padding:0 14px;border-radius:28px;
      background:var(--pill);color:var(--text);
      font:400 1rem/1 'Inter',system-ui;letter-spacing:.06em;
      border:none;cursor:pointer;text-decoration:none;
      transition:background .2s
    }
    .btn-support:hover{background:#404040}
    .btn-support .heart-icon{font-family:'Material Icons Round';font-size:1.1rem;color:#FFBC40}
    .footer-right{margin-left:auto;color:var(--muted);font-size:1rem;font-weight:500;letter-spacing:.06em}

    /* Responsive */
    @media (max-width:1400px){:root{--pad:2rem}.navbar{padding:0 2rem}footer{padding:0 2rem}}
    @media (max-width:768px){
      .navbar{padding:0 1rem}
      .nav-wordmark{display:none}
      .nav-join{display:none}
      .social-row{gap:12px}
      .nav-left{gap:12px}
      footer{height:auto;padding:.75rem 1rem;flex-wrap:wrap;gap:.5rem}
      .footer-center{position:static;transform:none;order:3;width:100%;display:flex;justify-content:center}
      .footer-copy,.footer-right{font-size:.85rem}
    }
    @media (max-width:480px){
      .social-row{gap:8px}
      .social-row a svg{width:16px;height:16px}
    }
  </style>
  {% if page.extra_css %}{{ page.extra_css }}{% endif %}
</head>
<body>
<nav class="navbar">
  <div class="nav-left">
    <a href="/" class="nav-brand">
      <!-- Logo Symbol placeholder -->
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><rect width="24" height="24" fill="#D9D9D9"/></svg>
      <div class="nav-wordmark">
        <!-- Wordmark placeholder (scaled width/height) -->
        <svg width="97" height="21" viewBox="0 0 24 24" fill="none"><rect width="24" height="24" fill="#D9D9D9"/></svg>
        <span class="sep">|</span>
        <span>Корисне</span>
      </div>
    </a>
    {% if page.back_url %}
    <a href="{{ page.back_url }}" class="btn-pill">
      <span class="material-icons-round">arrow_back</span>{{ page.back_label | default: 'Головна' }}
    </a>
    {% endif %}
  </div>
  <div class="nav-right">
    <span class="nav-join">Приєднуйся:</span>
    <div class="social-row">
      <a href="{{ site.social_twitch | default: '#' }}" target="_blank" rel="noopener" title="Twitch">
        <svg width="14" height="16" viewBox="0 0 24 24" fill="none"><rect width="24" height="24" fill="#D9D9D9"/></svg>
      </a>
      <a href="{{ site.social_telegram | default: '#' }}" target="_blank" rel="noopener" title="Telegram">
        <svg width="17" height="14" viewBox="0 0 24 24" fill="none"><rect width="24" height="24" fill="#D9D9D9"/></svg>
      </a>
      <a href="{{ site.social_discord | default: '#' }}" target="_blank" rel="noopener" title="Discord">
        <svg width="17" height="13" viewBox="0 0 24 24" fill="none"><rect width="24" height="24" fill="#D9D9D9"/></svg>
      </a>
      <a href="{{ site.social_youtube | default: '#' }}" target="_blank" rel="noopener" title="YouTube">
        <svg width="17" height="12" viewBox="0 0 24 24" fill="none"><rect width="24" height="24" fill="#D9D9D9"/></svg>
      </a>
      <a href="{{ site.social_tiktok | default: '#' }}" target="_blank" rel="noopener" title="TikTok">
        <svg width="12" height="14" viewBox="0 0 24 24" fill="none"><rect width="24" height="24" fill="#D9D9D9"/></svg>
      </a>
    </div>
  </div>
</nav>

<div class="page-wrap">{{ content }}</div>

<footer>
  <span class="footer-copy">© {{ site.time | date: "%Y" }} SABURO™</span>
  <div class="footer-center">
    <a href="{{ site.support_url | default: '#' }}" class="btn-support">
      <span class="heart-icon">favorite</span>Підтримати Мене
    </a>
  </div>
  <span class="footer-right">Для своїх 🇺🇦</span>
</footer>
</body>
</html>
