<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }} — SABURO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:     #141414;
      --sur:    #1A1A1A;
      --sur2:   #222222;
      --pill:   #303030;
      --text:   #ffffff;
      --muted:  #ADADAD;
      --border: rgba(255,255,255,.06);
      --r:      17px;
      --chroma: linear-gradient(65deg,
        #9C96FF 0%,  #9FE5F6 6%,  #E4FFA8 12%, #FCFF91 20%,
        #CCFFBF 28%, #C2FAAB 36%, #E0E1C9 44%, #F3CDDA 52%,
        #FFBED0 60%, #F8C2FF 68%, #CFFFFA 76%, #A5F3FF 84%,
        #A0BBFF 92%, #9C96FF 100%);
      --pad: 248px;
    }

    body {
      background: var(--bg); color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh; line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }

    /* ─── Pill button (navbar / footer) ─────────────────── */
    .btn-pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 0 14px; height: 32px; border-radius: 28px;
      background: var(--pill); color: var(--text);
      font: 400 1rem/1 'Inter', system-ui; letter-spacing: .06em;
      border: none; cursor: pointer; text-decoration: none;
      transition: background .2s; white-space: nowrap;
    }
    .btn-pill:hover { background: #404040; }
    .btn-pill .material-icons-round { font-size: 1rem; }

    /* ─── White secondary (icon + text) ─────────────────── */
    .btn-secondary {
      display: inline-flex; align-items: center; gap: .45rem;
      padding: .7rem 1.4rem; border-radius: 10px;
      background: #fff; color: #111;
      font: 600 .95rem/1 'Inter', system-ui; letter-spacing: .04em;
      box-shadow: 0 2px 10px rgba(0,0,0,.3);
      border: none; cursor: pointer; text-decoration: none;
      transition: transform .2s, box-shadow .2s; white-space: nowrap;
    }
    .btn-secondary:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(0,0,0,.4); color: #111; }
    .btn-secondary .material-icons-round { font-size: 1.1rem; }

    /* ─── Chrome gradient primary ────────────────────────── */
    .btn-primary {
      display: inline-flex; align-items: center;
      padding: .7rem 1.4rem; border-radius: 10px;
      background: #fff; color: #111;
      font: 600 .95rem/1 'Inter', system-ui; letter-spacing: .04em;
      box-shadow: 0 2px 10px rgba(0,0,0,.3);
      border: none; cursor: pointer; text-decoration: none;
      position: relative; z-index: 0;
      transition: transform .2s, box-shadow .2s;
    }
    .btn-primary .btn-label {
      position: relative; z-index: 2;
      transition: color .3s; pointer-events: none;
    }
    .btn-primary::before {
      content: ''; position: absolute; inset: 0; border-radius: 10px;
      background: var(--chroma); background-size: 200% 100%;
      animation: chromaSlide 3s linear infinite;
      opacity: 0; transition: opacity .35s; z-index: 1;
    }
    .btn-primary::after {
      content: ''; position: absolute; inset: -8px; border-radius: 18px;
      background: var(--chroma); background-size: 200% 100%;
      animation: chromaSlide 3s linear infinite;
      filter: blur(16px); opacity: 0; transition: opacity .35s; z-index: -1;
    }
    .btn-primary:hover::before { opacity: 1; }
    .btn-primary:hover::after  { opacity: .75; }
    .btn-primary:hover .btn-label { color: #fff; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: none; }

    @keyframes chromaSlide {
      0%   { background-position:   0% 50%; }
      100% { background-position: 100% 50%; }
    }

    /* ─── Navbar ─────────────────────────────────────────── */
    .navbar {
      position: sticky; top: 0; z-index: 100;
      height: 56px; background: var(--sur);
      display: flex; align-items: center;
      padding: 0 var(--pad);
    }
    .nav-left { display: flex; align-items: center; gap: 35px; }
    .nav-brand { display: flex; align-items: center; gap: 14px; }
    .nav-wordmark {
      display: flex; align-items: center; gap: 6px;
      font-size: 1rem; font-weight: 500; letter-spacing: .06em;
    }
    .nav-right { margin-left: auto; display: flex; align-items: center; gap: 30px; }
    .nav-join  { font-size: 1rem; letter-spacing: .06em; }
    .social-row { display: flex; align-items: center; gap: 18px; }
    .social-row a { display: flex; align-items: center; opacity: .8; transition: opacity .2s; }
    .social-row a:hover { opacity: 1; }

    @media (max-width: 1400px) {
      :root { --pad: 2rem; }
      .navbar { padding: 0 2rem; }
    }
    @media (max-width: 768px) {
      .navbar { padding: 0 1rem; }
      .nav-wordmark { display: none; }
      .nav-join     { display: none; }
      .social-row   { gap: 12px; }
    }

    /* ─── Page wrapper ───────────────────────────────────── */
    .page-wrap { padding: 0 var(--pad); }
    @media (max-width: 768px) { .page-wrap { padding: 0 1rem; } }

    /* ─── Footer ─────────────────────────────────────────── */
    footer {
      height: 56px; background: var(--sur);
      display: flex; align-items: center;
      padding: 0 var(--pad); margin-top: 4rem;
      position: relative;
    }
    .footer-copy   { color: var(--muted); font-size: 1rem; font-weight: 500; letter-spacing: .06em; }
    .footer-center { position: absolute; left: 50%; transform: translateX(-50%); }
    .footer-right  { margin-left: auto; color: var(--muted); font-size: 1rem; font-weight: 500; letter-spacing: .06em; }
    .btn-support {
      display: inline-flex; align-items: center; gap: 8px;
      height: 32px; padding: 0 14px; border-radius: 28px;
      background: var(--pill); color: var(--text);
      font: 400 1rem/1 'Inter', system-ui; letter-spacing: .06em;
      border: none; cursor: pointer; text-decoration: none;
      transition: background .2s;
    }
    .btn-support:hover { background: #404040; }
    .btn-support .heart { font-family: 'Material Icons Round'; font-size: 1.1rem; color: #FFBC40; }
    @media (max-width: 768px) {
      footer { height: auto; padding: .75rem 1rem; flex-wrap: wrap; gap: .5rem; }
      .footer-center { position: static; transform: none; }
    }

    /* ─── Markdown content ───────────────────────────────── */
    .content h1,.content h2,.content h3,.content h4 { margin: 1.5rem 0 .75rem; color: #fff; }
    .content p  { margin: .75rem 0; }
    .content ul,.content ol { padding-left: 1.5rem; margin: .75rem 0; }
    .content a  { color: #9C96FF; text-decoration: underline; }
    .content blockquote {
      border-left: 3px solid #9C96FF; padding: .5rem 1rem;
      color: var(--muted); background: var(--sur2);
      margin: 1rem 0; border-radius: 0 8px 8px 0;
    }
    .content pre { background: #0d0d0d; border: 1px solid var(--border); border-radius: 8px; padding: 1rem; overflow-x: auto; margin: 1rem 0; }
    .content code { font-size: .88rem; background: rgba(255,255,255,.06); padding: .15em .4em; border-radius: 4px; }
    .content pre code { background: none; padding: 0; }
    .content img { max-width: 100%; border-radius: 8px; }
    .content table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
    .content th,.content td { border: 1px solid var(--border); padding: .6rem .9rem; }
    .content th { background: var(--sur2); }
    .content hr { border: none; border-top: 1px solid var(--border); margin: 2rem 0; }
  </style>
  {% if page.extra_css %}{{ page.extra_css }}{% endif %}
</head>
<body>

<!-- ═══ FOOTER ═══════════════════════════════════════════ -->
