<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Content Manager</title>
</head>
<body>
  <script>
    (function () {
      const params    = new URLSearchParams(window.location.search);
      const urlToken  = params.get('token');

      if (urlToken) {
        history.replaceState({}, '', location.pathname);
        sessionStorage.setItem('decap-github-token', urlToken);
      }

      const token = urlToken || sessionStorage.getItem('decap-github-token');

      if (!token) {
        // Redirect before Decap ever loads — this was the bug
        location.replace('https://decap-oauth.iamsaburo.workers.dev/admin/auth');
        return;
      }

      window.CMS_CONFIG = {
        backend: {
          name:          'github',
          repo:          'iamsaburo/iamsaburo.github.io',
          branch:        'main',
          base_url:      'https://decap-oauth.iamsaburo.workers.dev',
          auth_endpoint: 'auth',   // fallback popup if token expires
          token:         token,
        },
        media_folder: 'assets/uploads',
        site_url:     'https://iamsaburo.github.io',
        collections: [
          {
            name: 'blocks', label: 'Community Blocks',
            folder: '_blocks', create: true, slug: '{{slug}}',
            fields: [
              { label: 'Title',                      name: 'title',       widget: 'string',   required: true  },
              { label: 'Slug',                        name: 'slug',        widget: 'string',   required: true,
                pattern: ['^[a-z0-9-]+$', 'Lowercase letters, numbers, hyphens'] },
              { label: 'Static Image URL',            name: 'image',       widget: 'string',   required: true  },
              { label: 'GIF Image URL (optional)',    name: 'gif_image',   widget: 'string',   required: false },
              { label: 'Categories',                  name: 'categories',  widget: 'select',   required: true,
                multiple: true, options: ['StreamElements','Streamer.bot','Twitch','OBS'] },
              { label: 'Short Description',           name: 'description', widget: 'text',     required: false },
              { label: 'Full Info Content (Markdown)',name: 'body',        widget: 'markdown', required: false },
            ],
          },
        ],
      };

      // Only now load Decap — CMS_CONFIG is already set
      const s = document.createElement('script');
      s.src = 'https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js';
      s.onerror = () => {
        document.body.innerHTML =
          '<p style="padding:2rem;font-family:sans-serif">Failed to load Decap CMS.</p>';
      };
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
