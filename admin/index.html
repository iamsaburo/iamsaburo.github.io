<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta http-equiv="Cross-Origin-Opener-Policy" content="unsafe-none" />
  <title>Content Manager</title>
</head>
<body>
  <script>
    window.CMS_CONFIG = {
      backend: {
        name:          'github',
        repo:          'iamsaburo/iamsaburo.github.io',
        branch:        'main',
        base_url:      'https://decap-oauth.iamsaburo.workers.dev',
        auth_endpoint: 'auth',
      },
      media_folder: 'assets/uploads',
      site_url:     'https://iamsaburo.github.io',
      collections: [
        {
          name: 'blocks', label: 'Community Blocks',
          folder: '_blocks', create: true, slug: '{{slug}}',
          fields: [
            { label: 'Title',                       name: 'title',       widget: 'string',   required: true  },
            { label: 'Slug',                         name: 'slug',        widget: 'string',   required: true,
              pattern: ['^[a-z0-9-]+$', 'Lowercase letters, numbers, hyphens'] },
            { label: 'Static Image URL',             name: 'image',       widget: 'string',   required: true  },
            { label: 'GIF Image URL (optional)',     name: 'gif_image',   widget: 'string',   required: false },
            { label: 'Categories',                   name: 'categories',  widget: 'select',   required: true,
              multiple: true, options: ['StreamElements','Streamer.bot','Twitch','OBS'] },
            { label: 'Short Description',            name: 'description', widget: 'text',     required: false },
            { label: 'Full Info Content (Markdown)', name: 'body',        widget: 'markdown', required: false },
          ],
        },
      ],
    };
  </script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  
  <!-- Token Poller: Guaranteed to catch the token from localStorage -->
  <script>
    (function() {
      const TOKEN_KEY = 'decap_oauth_token';
      
      function tryLogin() {
        var rawToken = localStorage.getItem(TOKEN_KEY);
        if (!rawToken) return;

        try {
          var data = JSON.parse(rawToken);
          if (!data.token) throw new Error('Token missing from stored data');
          
          // Clean up immediately to prevent re-use
          localStorage.removeItem(TOKEN_KEY);

          // Create the message Decap CMS expects
          var message = 'authorization:github:success:' + JSON.stringify({
            token: data.token,
            provider: 'github'
          });

          // Dispatch the event. Decap's listener will catch it.
          window.dispatchEvent(new MessageEvent('message', {
            data: message,
            origin: window.location.origin
          }));
          
          console.log('Successfully dispatched stored auth token to Decap CMS.');
        } catch (e) {
          console.error('Error processing stored auth token:', e);
        }
      }

      // Check every 500ms. The popup will have stored the token by the time this runs.
      setInterval(tryLogin, 500);
    })();
  </script>
</body>
</html>
