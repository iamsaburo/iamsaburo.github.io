<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta http-equiv="Cross-Origin-Opener-Policy" content="unsafe-none" />
  <title>Content Manager</title>
</head>
<body>
  <script>
    // ── Token delivery system with retry ──────────────────────────────
    (function() {
      var pendingAuthMessage = null;
      var dispatchInterval = null;
      var dispatchCount = 0;
      var MAX_DISPATCH = 30; // 30 attempts × 500ms = 15 seconds

      function dispatchMessage() {
        if (!pendingAuthMessage) return;
        try {
          window.dispatchEvent(
            new MessageEvent('message', {
              data: pendingAuthMessage,
              origin: window.location.origin
            })
          );
          console.log('[Decap Auth] Dispatched token message (attempt ' + (dispatchCount + 1) + ')');
        } catch (e) {
          console.error('[Decap Auth] Dispatch error:', e);
        }
        dispatchCount++;
        if (dispatchCount >= MAX_DISPATCH) {
          clearInterval(dispatchInterval);
          console.log('[Decap Auth] Stopped retrying after max attempts');
        }
      }

      function startDispatch(tokenMessage) {
        pendingAuthMessage = tokenMessage;
        dispatchCount = 0;
        if (dispatchInterval) clearInterval(dispatchInterval);
        // Try once immediately, then every 500ms
        dispatchMessage();
        dispatchInterval = setInterval(dispatchMessage, 500);
      }

      // 1. BroadcastChannel listener (from relay.html)
      try {
        var bc = new BroadcastChannel('decap-oauth');
        bc.onmessage = function(e) {
          console.log('[Decap Auth] BroadcastChannel received:', e.data);
          startDispatch(e.data);
          bc.close();
        };
      } catch (err) {
        console.warn('BroadcastChannel not available:', err);
      }

      // 2. Direct postMessage listener (can be sent by relay.html opener fallback)
      window.addEventListener('message', function(event) {
        if (
          event.origin === window.location.origin &&
          typeof event.data === 'string' &&
          event.data.startsWith('authorization:github:success:')
        ) {
          console.log('[Decap Auth] Received opener message:', event.data);
          startDispatch(event.data);
        }
      });

      // 3. localStorage poller (catches token set before this script ran)
      (function pollLocalStorage() {
        try {
          var raw = localStorage.getItem('decap-github-token');
          if (raw) {
            var data = JSON.parse(raw);
            localStorage.removeItem('decap-github-token');
            var msg = 'authorization:github:success:' + JSON.stringify({
              token: data.token,
              provider: 'github'
            });
            console.log('[Decap Auth] Found token in localStorage, dispatching');
            startDispatch(msg);
            return; // token found, stop polling
          }
        } catch (e) {}
        setTimeout(pollLocalStorage, 500);
      })();
    })();
  </script>

  <script>
    window.CMS_CONFIG = {
      backend: {
        name:          'github',
        repo:          'iamsaburo/iamsaburo.github.io',
        branch:        'main',
        base_url:      'https://decap-oauth.iamsaburo.workers.dev',
        auth_endpoint: 'auth',
      },
      media_folder: 'assets/uploads',
      site_url:     'https://iamsaburo.github.io',
      collections: [
        {
          name: 'blocks', label: 'Community Blocks',
          folder: '_blocks', create: true, slug: '{{slug}}',
          fields: [
            { label: 'Title',                       name: 'title',       widget: 'string',   required: true  },
            { label: 'Slug',                         name: 'slug',        widget: 'string',   required: true,
              pattern: ['^[a-z0-9-]+$', 'Lowercase letters, numbers, hyphens'] },
            { label: 'Static Image URL',             name: 'image',       widget: 'string',   required: true  },
            { label: 'GIF Image URL (optional)',     name: 'gif_image',   widget: 'string',   required: false },
            { label: 'Categories',                   name: 'categories',  widget: 'select',   required: true,
              multiple: true, options: ['StreamElements','Streamer.bot','Twitch','OBS'] },
            { label: 'Short Description',            name: 'description', widget: 'text',     required: false },
            { label: 'Full Info Content (Markdown)', name: 'body',        widget: 'markdown', required: false },
          ],
        },
      ],
    };
  </script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
