<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Content Manager</title>
</head>
<body>
  <!-- Keep the BroadcastChannel relay script – it might still help in some setups -->
  <script>
    (function () {
      try {
        var bc = new BroadcastChannel('decap-oauth');
        bc.onmessage = function (e) {
          window.dispatchEvent(
            new MessageEvent('message', {
              data:   e.data,
              origin: window.location.origin,
            })
          );
          bc.close();
        };
      } catch (err) {
        console.warn('BroadcastChannel not available:', err);
      }
    })();

    window.CMS_CONFIG = {
      backend: {
        name:          'github',
        repo:          'iamsaburo/iamsaburo.github.io',
        branch:        'main',
        base_url:      'https://decap-oauth.iamsaburo.workers.dev',
        auth_endpoint: 'auth',
      },
      media_folder: 'assets/uploads',
      site_url:     'https://iamsaburo.github.io',
      collections: [
        // your collections …
      ],
    };
  </script>

  <!-- ⭐ NEW: inject token if present in URL -->
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var token = params.get('token');
      if (token) {
        // Immediately hide the token from the URL
        history.replaceState({}, '', location.pathname + location.hash);
        // Sneak the token into the backend config before the CMS loads
        window.CMS_CONFIG.backend.token = token;
        console.log('Token injected from URL – logging in automatically.');
      }
    })();
  </script>

  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
