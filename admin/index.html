<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Content Manager</title>
</head>
<body>
  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');

      if (token) {
        window.history.replaceState({}, document.title, window.location.pathname);
        sessionStorage.setItem('decap-github-token', token);
        window.CMS_CONFIG = {
          backend: {
            name: 'github',
            repo: 'iamsaburo/iamsaburo.github.io',
            branch: 'main',
            base_url: 'https://decap-oauth.iamsaburo.workers.dev',
            token: token
          }
        };
      } else {
        const storedToken = sessionStorage.getItem('decap-github-token');
        if (storedToken) {
          window.CMS_CONFIG = {
            backend: {
              name: 'github',
              repo: 'iamsaburo/iamsaburo.github.io',
              branch: 'main',
              base_url: 'https://decap-oauth.iamsaburo.workers.dev',
              token: storedToken
            }
          };
        } else {
          window.location.href = 'https://decap-oauth.iamsaburo.workers.dev/admin/auth';
        }
      }
    })();
  </script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
