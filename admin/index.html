<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta http-equiv="Cross-Origin-Opener-Policy" content="unsafe-none" />
  <title>Content Manager</title>
</head>
<body>
  <script>
    // === 1. Migrate any token from old backup to the official Decap key ===
    (function () {
      var OLD_KEY = 'decap_oauth_token';
      var OFFICIAL_KEY = 'decap-cms-github-iamsaburo/iamsaburo.github.io';

      try {
        var oldData = localStorage.getItem(OLD_KEY);
        if (oldData) {
          var parsed = JSON.parse(oldData);
          if (parsed.token) {
            localStorage.setItem(OFFICIAL_KEY, parsed.token);
            console.log('[migrate] Copied token from backup to official key');
          }
          localStorage.removeItem(OLD_KEY);
        }
      } catch (e) {}

      // For debugging
      if (localStorage.getItem(OFFICIAL_KEY)) {
        console.log('[migrate] Official token key is set. Will attempt auto-login.');
      }
    })();

    window.CMS_CONFIG = {
      backend: {
        name:          'github',
        repo:          'iamsaburo/iamsaburo.github.io',
        branch:        'main',
        base_url:      'https://decap-oauth.iamsaburo.workers.dev',
        auth_endpoint: 'auth',
      },
      media_folder: 'assets/uploads',
      site_url:     'https://iamsaburo.github.io',
      collections: [
        {
          name: 'blocks', label: 'Community Blocks',
          folder: '_blocks', create: true, slug: '{{slug}}',
          fields: [
            { label: 'Title',                       name: 'title',       widget: 'string',   required: true  },
            { label: 'Slug',                         name: 'slug',        widget: 'string',   required: true,
              pattern: ['^[a-z0-9-]+$', 'Lowercase letters, numbers, hyphens'] },
            { label: 'Static Image URL',             name: 'image',       widget: 'string',   required: true  },
            { label: 'GIF Image URL (optional)',     name: 'gif_image',   widget: 'string',   required: false },
            { label: 'Categories',                   name: 'categories',  widget: 'select',   required: true,
              multiple: true, options: ['StreamElements','Streamer.bot','Twitch','OBS'] },
            { label: 'Short Description',            name: 'description', widget: 'text',     required: false },
            { label: 'Full Info Content (Markdown)', name: 'body',        widget: 'markdown', required: false },
          ],
        },
      ],
    };
  </script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <!-- === 2. Auto-login popup trick === -->
  <script>
    (function () {
      var OFFICIAL_KEY = 'decap-cms-github-iamsaburo/iamsaburo.github.io';
      var token = null;

      try {
        token = localStorage.getItem(OFFICIAL_KEY);
      } catch (e) {}

      if (!token) return; // No token to use, normal login flow

      // We have a valid token. Open a microscopic popup that posts it back.
      // Use a Blob URL so the popup is same‑origin and can access window.opener.
      var messagePayload = 'authorization:github:success:' + JSON.stringify({
        token: token,
        provider: 'github'
      });

      var popupHtml = '<!DOCTYPE html><html><head><meta charset="utf-8"></head><body><script>' +
        'window.opener.postMessage(' + JSON.stringify(messagePayload) + ', window.location.origin);' +
        'window.close();' +
        '<\/script></body></html>';

      var blob = new Blob([popupHtml], { type: 'text/html' });
      var popupUrl = URL.createObjectURL(blob);

      // Delay slightly to let Decap's message listener initialize.
      setTimeout(function () {
        var popup = window.open(popupUrl, 'decap_auto_auth', 'width=1,height=1');
        // Clean up the Blob URL after a few seconds
        setTimeout(function () {
          URL.revokeObjectURL(popupUrl);
          if (popup && !popup.closed) popup.close();
        }, 3000);
      }, 1000);
    })();
  </script>
</body>
</html>
