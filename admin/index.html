<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Content Manager (Debug)</title>
  <style>
    #debug-panel {
      position: fixed; bottom: 10px; right: 10px; background: #000; color: #0f0;
      padding: 10px; font-family: monospace; font-size: 12px; z-index: 1000;
      max-width: 400px; word-break: break-all; opacity: 0.9;
    }
    #debug-panel button { margin-top: 5px; }
  </style>
</head>
<body>
  <div id="debug-panel">
    <div id="log-output"></div>
    <button onclick="manualApplyToken()">🔄 Apply token from URL</button>
    <button onclick="clearStorageAndReload()">🧹 Clear all tokens & Reload</button>
  </div>

  <script>
    // === LOGGING HELPER ===
    const logLines = [];
    function log(msg) {
      console.log('[index] ' + msg);
      logLines.push(msg);
      const el = document.getElementById('log-output');
      if (el) el.innerText = logLines.slice(-10).join('\n');
    }

    // === URL TOKEN DETECTION ===
    const urlParams = new URLSearchParams(window.location.search);
    const urlToken = urlParams.get('token');
    if (urlToken) {
      log('🔑 Token found in URL: ' + urlToken.substring(0, 8) + '…');
      // Do NOT remove from URL yet; Decap needs it.
    } else {
      log('ℹ️ No token in URL.');
    }

    // === MIGRATION (keep) ===
    (function () {
      var OLD_KEY = 'decap_oauth_token';
      var OFFICIAL_KEY = 'decap-cms-github-iamsaburo/iamsaburo.github.io';
      try {
        var oldData = localStorage.getItem(OLD_KEY);
        if (oldData) {
          var parsed = JSON.parse(oldData);
          if (parsed.token && !localStorage.getItem(OFFICIAL_KEY)) {
            localStorage.setItem(OFFICIAL_KEY, parsed.token);
            log('📦 Migrated old token to official key.');
          }
          localStorage.removeItem(OLD_KEY);
        } else {
          log('📦 No old token to migrate.');
        }
      } catch (e) {
        log('❌ Migration error: ' + e);
      }
    })();

    // === INTERCEPT DECAP AUTH EVENTS (if global CMS available) ===
    window.addEventListener('load', function() {
      if (window.CMS) {
        log('✅ Decap CMS global object found.');
        try {
          // Listen for login events (may vary per version)
          window.CMS.on('auth', function(data) {
            log('🔐 Auth event: ' + JSON.stringify(data).substring(0, 100));
          });
          window.CMS.on('login', function(data) {
            log('🔐 Login event: ' + JSON.stringify(data).substring(0, 100));
          });
          window.CMS.on('logout', function() {
            log('🔐 Logout event.');
          });
        } catch (e) {
          log('⚠️ Could not attach CMS listeners: ' + e.message);
        }
      } else {
        log('⚠️ window.CMS not available yet.');
      }
    });

    // === MANUAL TRIGGER: simulate what Decap should do on token URL ===
    function manualApplyToken() {
      log('🖐️ Manual apply token...');
      const tok = new URLSearchParams(window.location.search).get('token');
      if (!tok) {
        log('❌ No token in URL to apply.');
        return;
      }
      // Try to trigger Decap via localStorage (it might pick it up on reload)
      try {
        localStorage.setItem('decap-cms-github-iamsaburo/iamsaburo.github.io', tok);
        log('📌 Token set in localStorage, reloading...');
        // Also pass token as hash if needed: Decap sometimes uses #/...
        window.location.reload();
      } catch (e) {
        log('❌ ' + e);
      }
    }

    function clearStorageAndReload() {
      try {
        localStorage.clear();
        log('🧹 localStorage cleared. Reloading...');
        window.location.href = window.location.pathname; // remove query
      } catch (e) {
        log('❌ ' + e);
      }
    }
  </script>

  <script>
    window.CMS_CONFIG = {
      backend: {
        name:          'github',
        repo:          'iamsaburo/iamsaburo.github.io',
        branch:        'main',
        base_url:      'https://decap-oauth.iamsaburo.workers.dev',
        auth_endpoint: 'auth',
      },
      media_folder: 'assets/uploads',
      site_url:     'https://iamsaburo.github.io',
      collections: [
        {
          name: 'blocks', label: 'Community Blocks',
          folder: '_blocks', create: true, slug: '{{slug}}',
          fields: [
            { label: 'Title',                       name: 'title',       widget: 'string',   required: true  },
            { label: 'Slug',                         name: 'slug',        widget: 'string',   required: true,
              pattern: ['^[a-z0-9-]+$', 'Lowercase letters, numbers, hyphens'] },
            { label: 'Static Image URL',             name: 'image',       widget: 'string',   required: true  },
            { label: 'GIF Image URL (optional)',     name: 'gif_image',   widget: 'string',   required: false },
            { label: 'Categories',                   name: 'categories',  widget: 'select',   required: true,
              multiple: true, options: ['StreamElements','Streamer.bot','Twitch','OBS'] },
            { label: 'Short Description',            name: 'description', widget: 'text',     required: false },
            { label: 'Full Info Content (Markdown)', name: 'body',        widget: 'markdown', required: false },
          ],
        },
      ],
    };
  </script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
