<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Content Manager</title>
</head>
<body>
  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');

      // Full Decap CMS config (includes backend + collections)
      const fullConfig = {
        backend: {
          name: 'github',
          repo: 'iamsaburo/iamsaburo.github.io',
          branch: 'main',
          base_url: 'https://decap-oauth.iamsaburo.workers.dev'
        },
        media_folder: 'assets/uploads',
        site_url: 'https://iamsaburo.github.io',
        collections: [
          {
            name: 'blocks',
            label: 'Community Blocks',
            folder: '_blocks',
            create: true,
            slug: '{{slug}}',
            fields: [
              { label: 'Title', name: 'title', widget: 'string', required: true },
              { label: 'Slug', name: 'slug', widget: 'string', pattern: ['^[a-z0-9-]+$', 'Lowercase letters, numbers, hyphens'], required: true },
              { label: 'Static Image URL', name: 'image', widget: 'string', required: true, hint: 'Direct link to the static preview image (external URL allowed)' },
              { label: 'GIF Image URL (optional)', name: 'gif_image', widget: 'string', required: false, hint: 'Direct link to the animated GIF shown on hover. Leave empty if not needed.' },
              { label: 'Categories', name: 'categories', widget: 'select', required: true, multiple: true, options: ['StreamElements', 'Streamer.bot', 'Twitch', 'OBS'] },
              { label: 'Short Description (for homepage card)', name: 'description', widget: 'text', required: false },
              { label: 'Full Info Content (Markdown)', name: 'body', widget: 'markdown', required: false }
            ]
          }
        ]
      };

      if (token) {
        // Token from URL → store and inject
        window.history.replaceState({}, document.title, window.location.pathname);
        sessionStorage.setItem('decap-github-token', token);
        fullConfig.backend.token = token;
        window.CMS_CONFIG = fullConfig;
      } else {
        const storedToken = sessionStorage.getItem('decap-github-token');
        if (storedToken) {
          fullConfig.backend.token = storedToken;
          window.CMS_CONFIG = fullConfig;
        } else {
          window.location.href = 'https://decap-oauth.iamsaburo.workers.dev/admin/auth';
        }
      }
    })();
  </script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
