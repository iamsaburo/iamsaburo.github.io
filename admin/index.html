<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta http-equiv="Cross-Origin-Opener-Policy" content="unsafe-none" />
  <title>Content Manager</title>
</head>
<body>
  <script>
    // Relay page sends the token via BroadcastChannel (same origin).
    // We re-dispatch it as a window 'message' event so Decap picks it up.
    (function () {
      try {
        var bc = new BroadcastChannel('decap-oauth');
        bc.onmessage = function (e) {
          console.log('[Decap Auth] BroadcastChannel received:', e.data);
          window.dispatchEvent(
            new MessageEvent('message', {
              data:   e.data,
              origin: window.location.origin,   // passes Decap's origin check
            })
          );
          bc.close();
        };
      } catch (err) {
        console.warn('BroadcastChannel not available:', err);
      }
    })();

    window.CMS_CONFIG = {
      backend: {
        name:          'github',
        repo:          'iamsaburo/iamsaburo.github.io',
        branch:        'main',
        base_url:      'https://decap-oauth.iamsaburo.workers.dev',
        auth_endpoint: 'auth',
      },
      media_folder: 'assets/uploads',
      site_url:     'https://iamsaburo.github.io',
      collections: [
        {
          name: 'blocks', label: 'Community Blocks',
          folder: '_blocks', create: true, slug: '{{slug}}',
          fields: [
            { label: 'Title',                       name: 'title',       widget: 'string',   required: true  },
            { label: 'Slug',                         name: 'slug',        widget: 'string',   required: true,
              pattern: ['^[a-z0-9-]+$', 'Lowercase letters, numbers, hyphens'] },
            { label: 'Static Image URL',             name: 'image',       widget: 'string',   required: true  },
            { label: 'GIF Image URL (optional)',     name: 'gif_image',   widget: 'string',   required: false },
            { label: 'Categories',                   name: 'categories',  widget: 'select',   required: true,
              multiple: true, options: ['StreamElements','Streamer.bot','Twitch','OBS'] },
            { label: 'Short Description',            name: 'description', widget: 'text',     required: false },
            { label: 'Full Info Content (Markdown)', name: 'body',        widget: 'markdown', required: false },
          ],
        },
      ],
    };
  </script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <!-- Last resort fallback: poll localStorage for token saved by relay.html -->
  <script>
    (function() {
      var pollInterval = setInterval(function() {
        var raw;
        try {
          raw = localStorage.getItem('decap-github-token');
        } catch (e) {
          return;
        }
        if (raw) {
          try {
            var data = JSON.parse(raw);
            localStorage.removeItem('decap-github-token');
            var msg = 'authorization:github:success:' + JSON.stringify({
              token: data.token,
              provider: 'github'
            });
            window.dispatchEvent(new MessageEvent('message', {
              data: msg,
              origin: window.location.origin
            }));
            clearInterval(pollInterval);
          } catch (e) {
            localStorage.removeItem('decap-github-token');
          }
        }
      }, 500);

      // Stop polling after 30 seconds if never used
      setTimeout(function() { clearInterval(pollInterval); }, 30000);
    })();
  </script>
</body>
</html>
