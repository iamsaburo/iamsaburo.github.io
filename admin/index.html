<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta http-equiv="Cross-Origin-Opener-Policy" content="unsafe-none" />
  <title>Content Manager</title>
</head>
<body>
  <script>
    // Listen for the token from the popup (both postMessage and BroadcastChannel)
    (function () {
      function handleTokenMessage(data) {
        if (typeof data !== 'string') return;
        if (!data.startsWith('authorization:github:success:')) return;
        console.log('[index] Token message received.');
        // Forward to Decap (it listens for 'message' events)
        window.dispatchEvent(new MessageEvent('message', {
          data: data,
          origin: window.location.origin,
          source: window   // include a source object to mimic a real popup
        }));
      }

      // 1. Listen for direct postMessage from the popup
      window.addEventListener('message', function (e) {
        if (e.origin !== window.location.origin) return;
        handleTokenMessage(e.data);
      });

      // 2. BroadcastChannel fallback
      try {
        const bc = new BroadcastChannel('decap-oauth');
        bc.onmessage = function (e) {
          handleTokenMessage(e.data);
          bc.close();
        };
      } catch (err) { /* ignore */ }
    })();
  </script>

  <script>
    window.CMS_CONFIG = {
      backend: {
        name:          'github',
        repo:          'iamsaburo/iamsaburo.github.io',
        branch:        'main',
        base_url:      'https://decap-oauth.iamsaburo.workers.dev',
        auth_endpoint: 'auth',
      },
      media_folder: 'assets/uploads',
      site_url:     'https://iamsaburo.github.io',
      collections: [
        {
          name: 'blocks', label: 'Community Blocks',
          folder: '_blocks', create: true, slug: '{{slug}}',
          fields: [
            { label: 'Title',                       name: 'title',       widget: 'string',   required: true  },
            { label: 'Slug',                         name: 'slug',        widget: 'string',   required: true,
              pattern: ['^[a-z0-9-]+$', 'Lowercase letters, numbers, hyphens'] },
            { label: 'Static Image URL',             name: 'image',       widget: 'string',   required: true  },
            { label: 'GIF Image URL (optional)',     name: 'gif_image',   widget: 'string',   required: false },
            { label: 'Categories',                   name: 'categories',  widget: 'select',   required: true,
              multiple: true, options: ['StreamElements','Streamer.bot','Twitch','OBS'] },
            { label: 'Short Description',            name: 'description', widget: 'text',     required: false },
            { label: 'Full Info Content (Markdown)', name: 'body',        widget: 'markdown', required: false },
          ],
        },
      ],
    };
  </script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
