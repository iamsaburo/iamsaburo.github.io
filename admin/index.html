<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Content Manager</title>
</head>
<body>
  <script>
    function getCookie(name) {
      const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
      return match ? match[2] : null;
    }

    const token = getCookie('__Host-admin-token');

    if (token) {
      // Already authenticated – inject the backend config
      window.CMS_CONFIG = {
        backend: {
          name: 'github',
          repo: 'iamsaburo/iamsaburo.github.io',
          branch: 'main',
          base_url: 'https://decap-oauth.iamsaburo.workers.dev',
          token: token
        }
      };
    } else {
      // Not authenticated – go to GitHub via our Worker
      window.location.href = 'https://decap-oauth.iamsaburo.workers.dev/admin/auth';
    }
  </script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
