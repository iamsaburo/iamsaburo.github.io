backend:
  name: github
  repo: iamsaburo/iamsaburo.github.io
  branch: main
  base_url: https://sveltia-cms-auth.iamsaburo.workers.dev

media_folder: "assets/uploads"
site_url: https://iamsaburo.github.io

collections:
  - name: "blocks"
    label: "Community Blocks"
    folder: "_blocks"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
        required: true
      - label: "Slug"
        name: "slug"
        widget: "string"
        pattern: ["^[a-z0-9-]+$", "Lowercase letters, numbers, hyphens"]
        required: true
      - label: "Static Image URL"
        name: "image"
        widget: "string"
        required: true
        hint: "Direct link to the static preview image (external URL allowed)"
      - label: "GIF Image URL (optional)"
        name: "gif_image"
        widget: "string"
        required: false
        hint: "Direct link to the animated GIF shown on hover. Leave empty if not needed."
      - label: "Categories"
        name: "categories"
        widget: "select"
        required: true
        multiple: true
        options:
          - "StreamElements"
          - "Streamer.bot"
          - "Twitch"
          - "OBS"
      - label: "Short Description (for homepage card)"
        name: "description"
        widget: "text"
        required: false
      - label: "Full Info Content (Markdown)"
        name: "body"
        widget: "markdown"
        required: false