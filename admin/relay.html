<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Authorizing…</title></head>
<body>
<p style="font-family:sans-serif;padding:2rem;color:#555">
  Authorization complete — this window will close automatically.
</p>
<script>
(function () {
  // ---------- 1. Extract token from URL hash ----------
  var hash  = new URLSearchParams(window.location.hash.slice(1));
  var token = hash.get('t');

  if (!token) {
    document.querySelector('p').textContent =
      'Missing token — please try logging in again.';
    return;   // stop; the popup will stay open so you see the error
  }

  // Remove token from URL/history immediately
  history.replaceState({}, '', window.location.pathname);

  // Build the exact message Decap CMS expects
  var msg = 'authorization:github:success:' +
    JSON.stringify({ token: token, provider: 'github' });

  // ---------- 2. Send the token back to the main window ----------
  var opener = window.opener;

  // 2a. Try direct postMessage (only works if COOP allows it)
  if (opener && !opener.closed) {
    try {
      opener.postMessage(msg, window.location.origin);
      // Wait a tiny bit before closing, then close
      setTimeout(function () { window.close(); }, 200);
      return;
    } catch (e) {
      // Fall through to BroadcastChannel
    }
  }

  // 2b. BroadcastChannel – always works same‑origin
  try {
    var bc = new BroadcastChannel('decap-oauth');
    bc.postMessage(msg);
    bc.close();
  } catch (e) {
    document.querySelector('p').textContent =
      'Auth failed — your browser may not support BroadcastChannel.';
    return;
  }

  // Close after a short delay to ensure message delivery
  setTimeout(function () { window.close(); }, 400);
})();
</script>
</body>
</html>
