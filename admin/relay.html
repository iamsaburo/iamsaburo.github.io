<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Authorizing…</title></head>
<body>
<p style="font-family:sans-serif;padding:2rem;color:#555">
  Authorization complete — this window will close automatically.
</p>
<script>
(function () {
  const hash  = new URLSearchParams(location.hash.slice(1));
  const token = hash.get('t');

  if (!token) {
    document.querySelector('p').textContent =
      'Missing token — please try logging in again.';
    return;
  }

  // Clear token from URL/history immediately
  history.replaceState({}, '', location.pathname);

  const msg = 'authorization:github:success:' +
    JSON.stringify({ token: token, provider: 'github' });

  // 1. Try window.opener first (works when COOP didn't sever it)
  if (window.opener && !window.opener.closed) {
    try {
      window.opener.postMessage(msg, window.location.origin);
      setTimeout(() => window.close(), 300);
      return;
    } catch (e) { /* fall through */ }
  }

  // 2. BroadcastChannel — same-origin fallback (github.io → github.io)
  try {
    const bc = new BroadcastChannel('decap-oauth');
    bc.postMessage(msg);
    bc.close();
  } catch (e) {
    document.querySelector('p').textContent =
      'Auth failed — your browser may not support BroadcastChannel.';
    return;
  }

  setTimeout(() => window.close(), 400);
})();
</script>
</body>
</html>
