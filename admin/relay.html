<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Authorizing…</title></head>
<body>
<p style="font-family:sans-serif;padding:2rem;color:#555">
  Authorization complete — this window will close automatically.
</p>
<script>
(function () {
  const hash  = new URLSearchParams(location.hash.slice(1));
  const token = hash.get('t');

  if (!token) {
    document.querySelector('p').textContent =
      'Missing token — please try logging in again.';
    return;
  }

  // Clear token from URL/history immediately
  history.replaceState({}, '', location.pathname);

  // Store the token where the main page can reliably find it
  try {
    const authData = {
      token: token,
      provider: 'github',
      timestamp: Date.now()
    };
    localStorage.setItem('decap_oauth_token', JSON.stringify(authData));
  } catch (e) {
    console.error('Failed to save token to localStorage:', e);
  }

  // Close the popup after a short delay
  setTimeout(() => window.close(), 800);
})();
</script>
</body>
</html>
