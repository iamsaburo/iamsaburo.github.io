<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Authorizing…</title>
</head>
<body>
  <p>Sending login token to CMS…</p>
  <script>
    (function () {
      const hash  = new URLSearchParams(location.hash.slice(1));
      const token = hash.get('t');

      if (!token) {
        document.body.innerHTML = '<p>Missing token.</p>';
        return;
      }

      history.replaceState({}, '', location.pathname);
      const msg = 'authorization:github:success:' +
        JSON.stringify({ token: token, provider: 'github' });
      const origin = window.location.origin;

      let success = false;

      function trySend() {
        if (success) return;
        if (window.opener && !window.opener.closed) {
          try {
            window.opener.postMessage(msg, origin);
            console.log('[relay] ✅ Sent via opener.postMessage');
            success = true;
            document.body.innerHTML = '<p>Login successful — you can close this window.</p>';
            setTimeout(() => window.close(), 500);
          } catch (e) {
            console.warn('[relay] opener.postMessage error:', e);
          }
        } else {
          console.warn('[relay] No opener available.');
        }
      }

      // Try immediately, then every 500ms for up to 10 seconds
      trySend();
      const interval = setInterval(trySend, 500);
      setTimeout(() => {
        clearInterval(interval);
        if (!success) {
          // Ultimate fallback: BroadcastChannel
          try {
            const bc = new BroadcastChannel('decap-oauth');
            bc.postMessage(msg);
            bc.close();
            console.log('[relay] Fallback to BroadcastChannel');
          } catch (e) {}
          document.body.innerHTML += '<p>Could not send token automatically. Please close window and try again.</p>';
        }
        if (!success) setTimeout(() => window.close(), 3000);
      }, 10000);
    })();
  </script>
</body>
</html>
