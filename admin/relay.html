<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Authorizing…</title>
</head>
<body>
  <p>Authorization complete — redirecting CMS…</p>
  <script>
    (function () {
      const hash  = new URLSearchParams(location.hash.slice(1));
      const token = hash.get('t');

      if (!token) {
        document.body.textContent = 'Missing token — please try logging in again.';
        return;
      }

      // Clean URL
      history.replaceState({}, '', location.pathname);

      // Store token in both keys (for any future fallback)
      try {
        localStorage.setItem('decap-cms-github-iamsaburo/iamsaburo.github.io', token);
        localStorage.setItem('decap_oauth_token', JSON.stringify({
          token: token,
          provider: 'github',
          timestamp: Date.now()
        }));
      } catch (e) {}

      // Redirect the main window to Decap's token route
      const adminUrl = window.location.origin + '/admin/?token=' + encodeURIComponent(token);

      if (window.opener && !window.opener.closed) {
        try {
          // Same-origin? Redirect opener. If cross-origin, it'll fail silently and we fallback.
          window.opener.location.replace(adminUrl);
          window.close();
        } catch (e) {
          // Cross-origin or blocked: redirect the popup itself
          window.location.replace(adminUrl);
        }
      } else {
        // No opener available (e.g., user refreshed the popup): just go there in this window
        window.location.replace(adminUrl);
      }
    })();
  </script>
</body>
</html>
