<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Authorizing…</title>
  <style>
    body { font-family: monospace; padding: 2rem; background: #f5f5f5; }
    button { padding: 0.5rem 1rem; margin-top: 1rem; }
  </style>
</head>
<body>
  <p>Authorization complete — redirecting to CMS...</p>
  <script>
    (function () {
      const hash  = new URLSearchParams(location.hash.slice(1));
      const token = hash.get('t');

      if (!token) {
        document.querySelector('p').textContent = 'Missing token — please try logging in again.';
        return;
      }

      // Clear hash
      history.replaceState({}, '', location.pathname);

      // The key Decap uses to store the GitHub token.
      // Format: decap-cms-github-<backend.repo>
      const TOKEN_KEY = 'decap-cms-github-iamsaburo/iamsaburo.github.io';

      // Also keep a backup in case the key format differs
      const BACKUP_KEY = 'decap_oauth_token';

      try {
        // Save token directly where Decap looks for it
        localStorage.setItem(TOKEN_KEY, token);
        console.log('[relay] Token saved to', TOKEN_KEY);

        // Backup
        const backupData = { token, provider: 'github', timestamp: Date.now() };
        localStorage.setItem(BACKUP_KEY, JSON.stringify(backupData));
        console.log('[relay] Backup saved to', BACKUP_KEY);
      } catch (e) {
        console.error('[relay] localStorage error:', e);
      }

      // Now reload the opener window to force it to pick up the new token
      if (window.opener && !window.opener.closed) {
        try {
          window.opener.location.reload();
        } catch (e) {
          console.error('[relay] Could not reload opener:', e);
        }
      }

      // Close the popup
      setTimeout(() => window.close(), 600);
    })();
  </script>
</body>
</html>
