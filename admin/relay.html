<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Authorizing…</title>
  <style>
    body { font-family: monospace; padding: 2rem; background: #f5f5f5; }
    button { padding: 0.5rem 1rem; margin-top: 1rem; }
  </style>
</head>
<body>
  <p>Authorization complete — you can close this window.</p>
  <button onclick="window.close()">Close</button>
  <script>
    (function () {
      const hash  = new URLSearchParams(location.hash.slice(1));
      const token = hash.get('t');

      if (!token) {
        document.querySelector('p').textContent = 'Missing token — please try logging in again.';
        return;
      }

      history.replaceState({}, '', location.pathname);

      // Store token in both keys
      try {
        localStorage.setItem('decap-cms-github-iamsaburo/iamsaburo.github.io', token);
        localStorage.setItem('decap_oauth_token', JSON.stringify({
          token: token,
          provider: 'github',
          timestamp: Date.now()
        }));
        console.log('[relay] Token saved to localStorage');
      } catch (e) {
        console.error('[relay] localStorage error:', e);
      }
    })();
  </script>
</body>
</html>
