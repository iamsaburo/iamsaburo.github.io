<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Authorizing…</title></head>
<body>
<p style="font-family:sans-serif;padding:2rem;color:#555">
  Authorization complete — this window will close automatically.
</p>
<script>
(function () {
  const hash  = new URLSearchParams(location.hash.slice(1));
  const token = hash.get('t');

  if (!token) {
    document.querySelector('p').textContent =
      'Missing token — please try logging in again.';
    return;
  }

  // Clear token from URL/history immediately
  history.replaceState({}, '', location.pathname);

  const msg = 'authorization:github:success:' +
    JSON.stringify({ token: token, provider: 'github' });
  const origin = window.location.origin;   // same as main page origin

  function sendViaOpener() {
    if (window.opener && !window.opener.closed) {
      try {
        window.opener.postMessage(msg, origin);
        return true;
      } catch (e) {
        return false;
      }
    }
    return false;
  }

  // Try opener immediatelly, then retry
  let attempts = 0;
  const maxAttempts = 15;   // ~3 seconds (200ms * 15)
  const interval = setInterval(() => {
    if (sendViaOpener() || ++attempts >= maxAttempts) {
      clearInterval(interval);
      // If still not sent, fallback to BroadcastChannel
      if (attempts >= maxAttempts) {
        try {
          const bc = new BroadcastChannel('decap-oauth');
          bc.postMessage(msg);
          bc.close();
        } catch (e) {
          // Last resort: store token in localStorage so main page can pick it up
          try {
            localStorage.setItem('decap-github-token', JSON.stringify({
              token: token,
              provider: 'github',
              timestamp: Date.now()
            }));
          } catch (e2) { /* ignore */ }
        }
      }
      // Give the main page a moment to process, then close
      setTimeout(() => window.close(), 800);
    }
  }, 200);
})();
</script>
</body>
</html>
