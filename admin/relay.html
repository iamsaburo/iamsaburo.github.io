<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Authorizing…</title></head>
<body>
<p style="font-family:sans-serif;padding:2rem;color:#555">
  Authorization complete — this window will close automatically.
</p>
<script>
(function () {
  const hash  = new URLSearchParams(location.hash.slice(1));
  const token = hash.get('t');

  if (!token) {
    document.querySelector('p').textContent =
      'Missing token — please try logging in again.';
    return;
  }

  // Clear token from URL immediately
  history.replaceState({}, '', location.pathname);

  const msg = 'authorization:github:success:' +
    JSON.stringify({ token: token, provider: 'github' });
  const origin = window.location.origin;

  // Attempt 1: window.opener (with retries)
  function sendToOpener() {
    if (window.opener && !window.opener.closed) {
      try {
        window.opener.postMessage(msg, origin);
        return true;
      } catch (e) { }
    }
    return false;
  }

  let attempts = 0;
  const maxAttempts = 15;
  const interval = setInterval(() => {
    if (sendToOpener() || ++attempts >= maxAttempts) {
      clearInterval(interval);
      // After retries, fallback to BroadcastChannel + localStorage
      if (attempts >= maxAttempts) {
        // BroadcastChannel
        try {
          const bc = new BroadcastChannel('decap-oauth');
          bc.postMessage(msg);
          bc.close();
        } catch (e) {}

        // localStorage (ultimate fallback)
        try {
          localStorage.setItem('decap-github-token', JSON.stringify({
            token: token,
            provider: 'github',
            timestamp: Date.now()
          }));
        } catch (e) {}
      }
      setTimeout(() => window.close(), 800);
    }
  }, 200);
})();
</script>
</body>
</html>
