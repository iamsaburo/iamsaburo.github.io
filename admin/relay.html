<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Authorizing… (Debug)</title>
  <style>
    body { font-family: monospace; padding: 2rem; background: #fff; }
    button { padding: 0.5rem 1rem; margin-top: 1rem; }
  </style>
</head>
<body>
  <p>Authorization complete. <strong>Keep this window open to see logs.</strong></p>
  <button onclick="window.close()">Close manually</button>
  <pre id="log"></pre>
  <script>
    const logEl = document.getElementById('log');
    function log(msg) {
      console.log('[relay] ' + msg);
      logEl.textContent += msg + '\n';
    }

    (function () {
      const hash  = new URLSearchParams(location.hash.slice(1));
      const token = hash.get('t');
      log('Hash token: ' + (token ? token.substring(0, 6) + '…' : 'null'));

      if (!token) {
        log('❌ No token found in hash. Aborting.');
        document.querySelector('p').textContent = 'Missing token.';
        return;
      }

      history.replaceState({}, '', location.pathname);
      log('Cleared hash.');

      // Store in both keys
      try {
        localStorage.setItem('decap-cms-github-iamsaburo/iamsaburo.github.io', token);
        localStorage.setItem('decap_oauth_token', JSON.stringify({
          token: token,
          provider: 'github',
          timestamp: Date.now()
        }));
        log('✅ Token saved to localStorage.');
      } catch (e) {
        log('❌ localStorage error: ' + e);
      }

      // Redirect URL
      const adminUrl = window.location.origin + '/admin/?token=' + encodeURIComponent(token);
      log('🔄 Constructed admin URL: ' + adminUrl);

      if (window.opener && !window.opener.closed) {
        log('🪟 Opener available. Attempting to redirect opener...');
        try {
          window.opener.location.replace(adminUrl);
          log('✅ Opener redirected. Closing window...');
          // Keep open for 5 seconds so you can read logs, then close
          setTimeout(() => window.close(), 5000);
        } catch (e) {
          log('❌ Opener redirect blocked: ' + e.message);
          log('➡️ Redirecting this window instead.');
          window.location.replace(adminUrl);
        }
      } else {
        log('⚠️ No opener. Redirecting this popup to admin URL.');
        window.location.replace(adminUrl);
      }
    })();
  </script>
</body>
</html>
