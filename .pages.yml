content:
  - name: blocks
    label: SABURO™ | Корисне
    type: collection
    path: _blocks
    format: yaml-frontmatter
    fields:
      - name: title
        label: Заголовок
        type: string
        required: true
      - name: slug
        label: Ярлик
        type: string
        required: true
      - name: order
        label: Порядок сортування
        type: number
        required: false
      - name: hidden
        label: Прихована (не відображається у списку)
        type: boolean
        required: false
        default: false
      - name: image
        label: URL статичного зображення
        type: string
        required: true
      - name: gif_image
        label: URL GIF-зображення (необов'язково)
        type: string
        required: false
      - name: back_url
        label: URL кнопки "Назад" (необов'язково)
        type: string
        required: false
      - name: back_label
        label: Назва кнопки "Назад" (необов'язково)
        type: string
        required: false
      - name: categories
        label: Категорії
        type: select
        required: true
        options:
          multiple: true
          values:
            - label: StreamElements
              value: StreamElements
            - label: Streamer.bot
              value: Streamer.bot
            - label: Twitch
              value: Twitch
            - label: OBS
              value: OBS
      - name: tabs
        label: Вкладки (розділіть вміст у тілі за допомогою <!-- tab -->)
        type: object
        list: true
        required: false
        fields:
          - name: id
            label: ID вкладки (для внутрішнього використання)
            type: string
            required: true
            hint: "наприклад, buttons, formatting"
          - name: icon
            label: Іконка Material Icons (назва, необов'язково)
            type: string
            required: false
            hint: "наприклад, smart_button, format_align_left"
          - name: svg_icon
            label: Шлях до SVG-іконки (необов'язково)
            type: string
            required: false
            hint: "наприклад, /svg/logo_symbol.svg"
          - name: label
            label: Назва вкладки (відображається на вкладці)
            type: string
            required: true
            hint: "наприклад, Кнопки"
      - name: embed_max_width
        label: Максимальна ширина вбудованих медіа (необов'язково)
        type: string
        required: false
        hint: "Наприклад, 600px або 80%. Застосовується до зображень, відео та iframe"
      - name: markdown_guide
              label: 📘 Markdown інструкція
              type: text
              required: false
              default: |
                ## Кнопки (портативний HTML, не потребує {::nomarkdown})
                <a class="btn-saburo" data-visual="outline"
                  style="--btn-w:auto;--btn-h:48px;--radius:10px;" href="URL">
                  Текст
                </a>
                Варіанти data-visual: outline | white | pill | rainbow
                Додаткові: data-hover="rainbow" data-icon-visual="favorite" data-icon-position="after"

                ## Малий текст (#8)
                <small>дрібний підпис</small>
                або клас: <span class="sm">ще дрібніше</span>

                ## Вкладки посередині сторінки (#7)
                <div class="inline-tabs">
                  <nav class="tabs-nav" role="tablist">
                    <button class="tab-btn active" data-tab="t1" role="tab">Вкладка 1</button>
                    <button class="tab-btn" data-tab="t2" role="tab">Вкладка 2</button>
                  </nav>
                  <div class="tab-panel active" data-tab="t1">
                    Вміст 1 (HTML)
                  </div>
                  <div class="tab-panel" data-tab="t2">
                    Вміст 2
                  </div>
                </div>

                ## Зображення — іконка завантаження (#9)
                Додається автоматично при наведенні на всі зображення.

                ## Код — копіювання (#10)
                Кнопка Copy з'являється на всіх блоках ```code```.
                Inline `код` копіюється кліком.

                ## Приховати сторінку (#12)
                Встановіть hidden: true у frontmatter.
                Сторінка генерується, але не відображається у списку.
        hint: "Це поле лише для довідки. Не потребує редагування."
      - name: body
        label: Повний вміст
        type: markdown
        required: false