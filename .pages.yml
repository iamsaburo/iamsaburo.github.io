content:
  - name: blocks
    label: SABURO™ | Корисне
    type: collection
    path: _blocks
    format: yaml-frontmatter
    fields:
      - name: title
        label: Заголовок
        type: string
        required: true
      - name: slug
        label: Ярлик
        type: string
        required: true
      - name: order
        label: Порядок сортування
        type: number
        required: false
      - name: hidden
        label: Прихована (не відображається у списку)
        type: boolean
        required: false
        default: false
      - name: image
        label: URL статичного зображення
        type: string
        required: true
      - name: gif_image
        label: URL GIF-зображення (необов'язково)
        type: string
        required: false
      - name: back_url
        label: URL кнопки "Назад" (необов'язково)
        type: string
        required: false
      - name: back_label
        label: Назва кнопки "Назад" (необов'язково)
        type: string
        required: false
      - name: categories
        label: Категорії
        type: select
        required: true
        options:
          multiple: true
          values:
            - label: StreamElements
              value: StreamElements
            - label: Streamer.bot
              value: Streamer.bot
            - label: Twitch
              value: Twitch
            - label: OBS
              value: OBS
      - name: tabs
        label: Вкладки (розділіть вміст у тілі за допомогою <!-- tab -->)
        type: object
        list: true
        required: false
        fields:
          - name: id
            label: ID вкладки (для внутрішнього використання)
            type: string
            required: true
            hint: "наприклад, buttons, formatting"
          - name: icon
            label: Іконка Material Icons (назва, необов'язково)
            type: string
            required: false
            hint: "наприклад, smart_button, format_align_left"
          - name: svg_icon
            label: Шлях до SVG-іконки (необов'язково)
            type: string
            required: false
            hint: "наприклад, /svg/logo_symbol.svg"
          - name: label
            label: Назва вкладки (відображається на вкладці)
            type: string
            required: true
            hint: "наприклад, Кнопки"
      - name: embed_max_width
        label: Максимальна ширина вбудованих медіа (необов'язково)
        type: string
        required: false
        hint: "Наприклад, 600px або 80%. Застосовується до зображень, відео та iframe"
      - name: body
        label: Повний вміст
        type: markdown
        required: false