# Configuration for Pages CMS - SABURO™ | Корисне

media:
  - name: uploads
    label: Uploads
    input: assets/uploads
    output: /assets/uploads
    categories: [image]

content:
  - name: blocks
    label: Community Blocks
    type: collection
    path: _blocks
    format: yaml-frontmatter
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: slug
        label: Slug
        type: string
        required: true
      - name: image
        label: Static Image
        type: image
        required: true
      - name: gif_image
        label: GIF Image (optional)
        type: image
        required: false
      - name: categories
        label: Categories
        type: select
        required: true
        multiple: true
        options:
          - StreamElements
          - Streamer.bot
          - Twitch
          - OBS
      - name: description
        label: Short Description
        type: text
        required: false
      - name: body
        label: Full Info Content
        type: markdown
        required: false
        description: >-
          Use Markdown. Available include: btn-saburo
          (label, visual [outline,white,rainbow,pill],
          icon_visual, icon_hover, icon_position, width, height, radius, href).
          Example: {% include btn-saburo.html label='Button' visual='outline' icon_visual='favorite' %}
          Supports headings, code, tables, images, etc.
      - name: layout
        label: Layout
        type: hidden
        default: block-info