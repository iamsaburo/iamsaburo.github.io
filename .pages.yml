# Configuration for Pages CMS

media:
  - name: uploads
    label: SABURO™ | Корисне
    input: assets/uploads
    output: /assets/uploads
    categories: [image]

content:
  - name: blocks
    label: Community Blocks
    type: collection
    path: _blocks
    format: yaml-frontmatter
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: slug
        label: Slug
        type: string
        required: true
      - name: image
        label: Static Image
        type: image
        required: true
      - name: gif_image
        label: GIF Image (optional)
        type: image
        required: false
      - name: categories
        label: Categories
        type: select
        required: true
        multiple: true
        options:
          - StreamElements
          - Streamer.bot
          - Twitch
          - OBS
      - name: description
        label: Short Description
        type: text
        required: false
      - name: body
        label: Full Info Content
        type: markdown
        required: false
        description: >
          **Cheat sheet:**  
          `{% include btn-saburo.html label="Label" visual="outline|white|rainbow|pill" hover="outline|white|rainbow" icon_visual="icon_name" icon_hover="icon_name" icon_position="before|after" width="auto|140" height="48" radius="10" %}`  
          **Markdown:** bold, italic, strikethrough, code, lists, blockquotes, tables, links, images.  
          Use `<div class="content-container" markdown="1">` to wrap body content.