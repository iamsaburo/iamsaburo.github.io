# Configuration for Pages CMS - SABURO™ | Корисне

media:
  - name: uploads
    label: Uploads
    input: assets/uploads
    output: /assets/uploads
    categories: [image]

content:
  - name: blocks
    label: SABURO™ | Корисне
    type: collection
    path: _blocks
    format: yaml-frontmatter
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: slug
        label: Slug
        type: string
        required: true
      - name: image
        label: Static Image URL
        type: string
        required: true
      - name: gif_image
        label: GIF Image URL (optional)
        type: string
        required: false
      - name: back_url
        label: Back Button URL (optional)
        type: string
        required: false
      - name: back_label
        label: Back Button Label (optional)
        type: string
        required: false
      - name: categories
        label: Categories
        type: select
        required: true
        multiple: true
        options:
          - StreamElements
          - Streamer.bot
          - Twitch
          - OBS
      - name: description
        label: Short Description
        type: text
        required: false
      - name: body
        label: Full Info Content
        type: markdown
        required: false
        description: |
          Cheat sheet for -info pages:
          Buttons: {% include btn-saburo.html label="Label" visual="outline|white|rainbow|pill" … %}
          All Markdown features: headings, bold, italic, lists, code, blockquote, tables, etc.